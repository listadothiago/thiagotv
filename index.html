<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiagoTV</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 30%, #1b3a6b 0%, #12244a 45%, #070f22 100%);
            background-attachment: fixed;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }

        /* With nothing below the set, the page is shorter than the window on most
           screens. Centring keeps the television the object in the room rather than
           something pinned to the top of a mostly empty page. */
        .stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 40px);
            gap: 22px;
            max-width: 900px;
            margin: 0 auto;
        }

        .tv-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
        }

        .tv-frame {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, #3d2817 0%, #5c3d2e 25%, #4a3220 50%, #5c3d2e 75%, #3d2817 100%);
            border-radius: 30px;
            box-shadow:
                inset 0 2px 5px rgba(255, 255, 255, 0.2),
                inset 0 -2px 5px rgba(0, 0, 0, 0.8),
                0 20px 60px rgba(0, 0, 0, 0.9);
            /* Extra room at the bottom so the brand plate has the cabinet to itself
               and never rides up into the knob labels. */
            padding: 36px 50px 76px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 22px;
        }

        .screen-bezel {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            box-shadow:
                inset 0 2px 8px rgba(0, 0, 0, 0.9),
                inset 0 -2px 8px rgba(0, 0, 0, 0.5);
            padding: 8px;
            overflow: hidden;
        }

        .screen-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
        }

        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 3;
        }

        #player, #player iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }

        /* ---- The screen card -------------------------------------------------
           Covers the player whenever there's nothing to watch: mid-tune, on an
           empty channel, or at the end of a channel's broadcast. Every variant
           is drawn in CSS/canvas rather than loaded as an image, so the whole
           site stays a couple of static files. */
        .screen-card {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: #050505;
            z-index: 2;
            overflow: hidden;
        }
        .screen-card.visible { display: flex; }

        .card-layer { position: absolute; inset: 0; display: none; }
        .screen-card[data-mode="bars"]     .layer-bars,
        .screen-card[data-mode="snow"]     .layer-snow,
        .screen-card[data-mode="testcard"] .layer-testcard { display: block; }

        /* SMPTE colour bars: seven full-height bars over a castellated strip. */
        .layer-bars {
            background:
                linear-gradient(180deg, transparent 0 74%, #0a0a0a 74% 100%),
                linear-gradient(90deg,
                    #bfbfbf 0 14.2857%, #bfbf00 14.2857% 28.5714%,
                    #00bfbf 28.5714% 42.8571%, #00bf00 42.8571% 57.1428%,
                    #bf00bf 57.1428% 71.4285%, #bf0000 71.4285% 85.7142%,
                    #0000bf 85.7142% 100%);
        }
        .layer-bars::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0; height: 26%;
            background: linear-gradient(90deg,
                #00006e 0 14.2857%, #0a0a0a 14.2857% 28.5714%,
                #bf00bf 28.5714% 42.8571%, #0a0a0a 42.8571% 57.1428%,
                #00bfbf 57.1428% 71.4285%, #0a0a0a 71.4285% 85.7142%,
                #bfbfbf 85.7142% 100%);
        }

        .layer-snow { background: #000; }
        .layer-snow canvas { width: 100%; height: 100%; display: block; }

        /* Test card: crosshair, rings and a grid, the way a station ident looked
           between programmes. */
        .layer-testcard {
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 9%),
                repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 9%),
                radial-gradient(circle at 50% 50%, #16324e 0%, #08131f 70%, #050a10 100%);
        }
        .layer-testcard::before,
        .layer-testcard::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            border: 2px solid rgba(201, 169, 97, .55);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .layer-testcard::before { width: 58%; padding-bottom: 58%; }
        .layer-testcard::after  { width: 30%; padding-bottom: 30%; border-color: rgba(127,212,255,.45); }

        /* The message plate sits above whichever backdrop is showing. */
        .card-plate {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 14px 26px;
            background: rgba(0, 0, 0, .74);
            border: 1px solid rgba(201, 169, 97, .35);
            border-radius: 3px;
            max-width: 80%;
        }
        .card-title {
            color: #f0e2bf;
            font-size: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1.5;
        }
        .card-sub {
            margin-top: 8px;
            color: #7fd4ff;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: .85;
        }
        /* A slow pulse reads as a broadcast holding pattern rather than a frozen
           page -- it tells the viewer the set is still on. */
        .screen-card.holding .card-plate { animation: holding 2.6s ease-in-out infinite; }
        @keyframes holding {
            0%, 100% { opacity: 1; }
            50%      { opacity: .55; }
        }

        @media (max-width: 768px) {
            .card-title { font-size: 12px; letter-spacing: 2px; }
            .card-sub { font-size: 9px; }
        }

        .stage-nav {
            width: 100%;
            text-align: center;
            padding-bottom: 10px;
        }
        .stage-nav a {
            color: #7fd4ff;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-bottom: 1px solid rgba(127, 212, 255, .35);
            padding-bottom: 3px;
        }
        .stage-nav a:hover { color: #c9a961; border-bottom-color: #c9a961; }

        .stage-note {
            margin-top: 14px;
            color: #6f8fb5;
            font-size: 10.5px;
            letter-spacing: 1px;
            line-height: 1.8;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }
        .stage-note a {
            font-size: 10.5px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* ---- Bulletin ---------------------------------------------------------
           The text channel. Styled after a station caption slide rather than a
           web page: fixed frame, generous margins, and phosphor colours, so it
           reads as something being broadcast rather than something rendered. */
        .psa-screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 7% 8%;
            background:
                linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 30%),
                radial-gradient(ellipse at 50% 40%, #10314a 0%, #071a2a 70%, #04101a 100%);
            z-index: 2;
        }
        .psa-screen.visible { display: flex; }

        .psa-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding-bottom: 8px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(201, 169, 97, .4);
            color: #c9a961;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            flex: none;
        }
        #psaStamp { color: #7fd4ff; letter-spacing: 1px; opacity: .8; }

        .psa-body {
            flex: 1;
            overflow-y: auto;
            color: #eaf6ff;
            font-size: 17px;
            line-height: 1.65;
            text-shadow: 0 0 8px rgba(127, 212, 255, .35);
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            .psa-body { font-size: 12px; line-height: 1.5; }
            .psa-head { font-size: 9px; letter-spacing: 1px; }
        }

        .video-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: #c9a961;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 10px;
            border-radius: 4px;
            z-index: 2;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Two knobs, wide apart, with the brand sitting between them at the
           bottom of the cabinet -- the only controls the set has. */
        .control-panel {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 180px;
            width: 100%;
        }

        .knob-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .knob {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #444, #111);
            box-shadow:
                inset 0 2px 4px rgba(0, 0, 0, 0.8),
                0 2px 4px rgba(0, 0, 0, 0.5);
            position: relative;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .knob:hover { transform: scale(1.05); }
        .knob:active { transform: scale(0.96); }

        .knob::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            width: 3px;
            height: 12px;
            background: #f0a020;
            border-radius: 2px;
            transform-origin: 50% 20px;
            transform: translateX(-50%) rotate(var(--knob-angle, 0deg));
            transition: transform 0.2s ease-out;
        }

        .knob-label {
            font-size: 11px;
            color: #ddd;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .knob-value {
            font-size: 11px;
            color: #c9a961;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-height: 14px;
        }

        .brand {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 22px;
            font-weight: bold;
            color: #c9a961;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 3px;
        }

        @media (max-width: 768px) {
            .tv-frame { padding: 18px 22px 52px; gap: 14px; }
            .control-panel { gap: 90px; }
            .brand { font-size: 16px; bottom: 10px; }
        }
    </style>
</head>
<body>
  <div class="stage">
    <div class="tv-container">
        <div class="tv-frame">
            <div class="screen-bezel">
                <div class="screen-inner scanlines">
                    <div id="player"></div>
                    <div class="screen-card" id="screenCard" data-mode="snow">
                        <div class="card-layer layer-bars"></div>
                        <div class="card-layer layer-snow"><canvas id="snowCanvas"></canvas></div>
                        <div class="card-layer layer-testcard"></div>
                        <div class="card-plate">
                            <div class="card-title" id="cardTitle">Please stand by</div>
                            <div class="card-sub" id="cardSub"></div>
                        </div>
                    </div>
                    <div class="psa-screen" id="psaScreen">
                        <div class="psa-head">
                            <span>ThiagoTV Bulletin</span>
                            <span id="psaStamp"></span>
                        </div>
                        <p class="psa-body" id="psaBody"></p>
                    </div>
                    <div class="video-info" id="videoInfo">Warming up the tubes…</div>
                </div>
            </div>

            <div class="control-panel">
                <div class="knob-group">
                    <div class="knob" id="volumeKnob"></div>
                    <div class="knob-label">Volume</div>
                    <div class="knob-value" id="volumeValue">Muted</div>
                </div>

                <div class="knob-group">
                    <div class="knob" id="channelKnob"></div>
                    <div class="knob-label">Channel</div>
                    <div class="knob-value" id="channelValue">Latest</div>
                </div>
            </div>

            <div class="brand">ThiagoTV</div>
        </div>
    </div>


    <!-- A real anchor, not a scripted one: this is how a crawler finds its way
         from the front page into the generated programme pages. -->
    <nav class="stage-nav">
      <a href="guide.html">Programme guide — every broadcast, with notes</a>
      <p class="stage-note">
        This set remembers what you've watched so it can show you something new.
        That memory stays in your browser and is never sent anywhere.
        <a href="#" id="forgetLink">Reset viewing history</a>
      </p>
    </nav>
  </div>

    <script>
    (function () {
        'use strict';

        // ---- Channel definitions -------------------------------------------------
        // A channel is a filter plus an ordering, and one more thing: whether it will
        // show a viewer something they've already seen.
        //
        // `repeat: false` makes a channel strictly about what's new to *you*. When
        // you've seen everything it carries, it has nothing to say and goes to static
        // rather than pretending. Latest is that channel -- its whole promise is
        // newness, and quietly re-running old videos would break it.
        //
        // Every other channel repeats once you're through the unseen ones, because
        // their promise is a genre, not a novelty, and a music channel that refuses
        // to play anything twice is just a channel that switches itself off.
        var CHANNELS = [
            { id: 'latest',   label: 'Latest',   tag: null,        order: 'newest', repeat: false },
            // The one channel that carries no video: a text bulletin that expires
            // on its own. See renderPsa().
            { id: 'psa',      label: 'Bulletin', kind: 'text' },
            { id: 'random',   label: 'Random',   tag: null,        order: 'shuffle' },
            { id: 'music',    label: 'Music',    tag: 'music',     order: 'shuffle' },
            // Long-form. `resume: true` makes the channel pick a film up where the
            // viewer left it -- see the resume block below for why that runs out.
            { id: 'films',    label: 'Films',    tag: 'films',     order: 'shuffle', resume: true },
            { id: 'nature',   label: 'Nature',   tag: 'nature',    order: 'shuffle' },
            { id: 'comedy',   label: 'Comedy',   tag: 'comedy',    order: 'shuffle' },
            { id: 'vignette', label: 'Vignette', tag: 'vignette',  order: 'shuffle' }
        ];

        var library = [];        // everything from playlist.json
        var psa = null;          // the current bulletin, if any

        // ---- Viewing memory ------------------------------------------------------
        // What this viewer has already watched, kept in their own browser and sent
        // nowhere. It exists so a returning visitor gets shown something new rather
        // than the same video that greeted them last time.
        //
        // Entries expire: a station that never repeats anything is a station that
        // eventually has nothing to show, and after a few months a video is worth
        // seeing again anyway.
        var SEEN_KEY = 'thiagotv.seen.v1';
        var SEEN_TTL_DAYS = 90;

        var seen = Object.create(null);   // videoId -> epoch ms, last watched
        var seenAtLoad = Object.create(null); // snapshot, so "repeat" stays stable

        function storage() {
            // Private browsing and blocked-storage settings both throw here rather
            // than returning null, and a TV that won't switch on because it can't
            // take notes is a bad trade. Losing the memory is the acceptable failure.
            try {
                var probe = '__tv__';
                window.localStorage.setItem(probe, probe);
                window.localStorage.removeItem(probe);
                return window.localStorage;
            } catch (e) {
                return null;
            }
        }

        function loadSeen() {
            var store = storage();
            if (!store) return;
            try {
                var raw = JSON.parse(store.getItem(SEEN_KEY) || '{}');
                var cutoff = Date.now() - SEEN_TTL_DAYS * 86400000;
                Object.keys(raw).forEach(function (id) {
                    if (typeof raw[id] === 'number' && raw[id] > cutoff) seen[id] = raw[id];
                });
            } catch (e) {
                console.warn('ThiagoTV: could not read viewing memory', e);
            }
            Object.keys(seen).forEach(function (id) { seenAtLoad[id] = seen[id]; });
        }

        // Merge rather than overwrite. Two tabs of the set share one localStorage but
        // not one copy of `seen`, so a plain write means whichever tab saves last
        // erases whatever the other one watched. Reading first and keeping the later
        // timestamp for each video makes concurrent tabs additive instead.
        function saveSeen() {
            var store = storage();
            if (!store) return;
            try {
                var merged = {};
                try {
                    var existing = JSON.parse(store.getItem(SEEN_KEY) || '{}');
                    Object.keys(existing).forEach(function (id) {
                        if (typeof existing[id] === 'number') merged[id] = existing[id];
                    });
                } catch (e) { /* unreadable: this write replaces it */ }

                Object.keys(seen).forEach(function (id) {
                    if (!merged[id] || seen[id] > merged[id]) merged[id] = seen[id];
                });

                store.setItem(SEEN_KEY, JSON.stringify(merged));
            } catch (e) {
                // Quota, most likely. Not worth interrupting playback over.
                console.warn('ThiagoTV: could not save viewing memory', e);
            }
        }

        function markSeen(videoId) {
            if (!videoId) return;
            seen[videoId] = Date.now();
            saveSeen();
        }

        // Two different questions, deliberately answered by two different records.
        //
        // wasSeen drives ordering and must be live: a video watched a minute ago
        // should sort behind one that hasn't been.
        //
        // isRepeat drives the on-screen label and must NOT be live, or a video
        // would relabel itself as a repeat while the viewer is still watching it
        // for the first time.
        function wasSeen(videoId) {
            return Object.prototype.hasOwnProperty.call(seen, videoId);
        }

        function isRepeat(videoId) {
            return Object.prototype.hasOwnProperty.call(seenAtLoad, videoId);
        }

        // ---- Resume points -------------------------------------------------------
        // Where the viewer got to in a long film. Dropping someone back at 00:00 of a
        // ninety-minute picture is the one place the "just keep broadcasting" model
        // falls down, so channels marked `resume: true` remember the position.
        //
        // It runs out deliberately. Someone who has dipped into the same film six
        // times and never finished it isn't going to; past that the film stops being
        // offered as unfinished business and is treated as watched, so the channel
        // moves on to something else. Without a cap, one abandoned film would greet
        // that viewer forever.
        var RESUME_KEY = 'thiagotv.resume.v1';
        var MAX_RESUMES = 6;
        var RESUME_MIN_SECONDS = 30;   // below this, just start it again
        var RESUME_END_MARGIN = 90;    // this close to the end counts as finished
        var PROGRESS_MS = 5000;

        var resumePoints = Object.create(null);  // videoId -> { t: seconds, n: resumes }
        var progressTimer = null;

        function loadResume() {
            var store = storage();
            if (!store) return;
            try {
                var raw = JSON.parse(store.getItem(RESUME_KEY) || '{}');
                Object.keys(raw).forEach(function (id) {
                    var r = raw[id];
                    if (r && typeof r.t === 'number' && typeof r.n === 'number') {
                        resumePoints[id] = { t: r.t, n: r.n };
                    }
                });
            } catch (e) {
                console.warn('ThiagoTV: could not read resume points', e);
            }
        }

        // Merged for the same reason as the watch history: two tabs share storage but
        // not memory, and a plain write loses whatever the other tab was watching.
        function saveResume() {
            var store = storage();
            if (!store) return;
            try {
                var merged = {};
                try {
                    var existing = JSON.parse(store.getItem(RESUME_KEY) || '{}');
                    Object.keys(existing).forEach(function (id) {
                        var r = existing[id];
                        if (r && typeof r.t === 'number') merged[id] = { t: r.t, n: r.n || 0 };
                    });
                } catch (e) { /* unreadable: this write replaces it */ }

                Object.keys(resumePoints).forEach(function (id) {
                    var mine = resumePoints[id];
                    var theirs = merged[id];
                    merged[id] = {
                        // Furthest position and highest count both win: whichever tab
                        // got further has the more useful answer.
                        t: theirs ? Math.max(mine.t, theirs.t) : mine.t,
                        n: theirs ? Math.max(mine.n, theirs.n || 0) : mine.n
                    };
                });

                store.setItem(RESUME_KEY, JSON.stringify(merged));
            } catch (e) {
                console.warn('ThiagoTV: could not save resume points', e);
            }
        }

        function clearResume(videoId) {
            delete resumePoints[videoId];
            var store = storage();
            if (!store) return;
            try {
                var raw = JSON.parse(store.getItem(RESUME_KEY) || '{}');
                delete raw[videoId];
                store.setItem(RESUME_KEY, JSON.stringify(raw));
            } catch (e) { /* nothing worth doing about it */ }
        }

        function stopProgressTracking() {
            if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
        }

        // Take a reading right now. The interval alone would lose up to five seconds
        // of a film whenever someone turns the dial or shuts the tab -- exactly the
        // two moments a resume point matters most.
        function captureProgress() {
            if (!current || !current.resume || !current.queue.length) return;
            if (!player || !playerReady || !expectingPlayback) return;
            var video = current.queue[current.index];
            var t, d;
            try {
                t = player.getCurrentTime();
                d = player.getDuration();
            } catch (e) { return; }
            if (!t || !d) return;

            if (d - t <= RESUME_END_MARGIN || t <= RESUME_MIN_SECONDS) {
                clearResume(video.videoId);
                return;
            }
            var existing = resumePoints[video.videoId];
            resumePoints[video.videoId] = { t: t, n: existing ? existing.n : 0 };
            saveResume();
        }

        function startProgressTracking(videoId) {
            stopProgressTracking();
            progressTimer = setInterval(function () {
                if (!player || !playerReady || !expectingPlayback) return;
                var t, d;
                try {
                    t = player.getCurrentTime();
                    d = player.getDuration();
                } catch (e) { return; }
                if (!t || !d) return;

                // Near the end is finished, not a place to come back to.
                if (d - t <= RESUME_END_MARGIN) {
                    clearResume(videoId);
                    return;
                }
                var existing = resumePoints[videoId];
                resumePoints[videoId] = { t: t, n: existing ? existing.n : 0 };
                saveResume();
            }, PROGRESS_MS);
        }

        function formatClock(seconds) {
            var s = Math.max(0, Math.floor(seconds));
            var h = Math.floor(s / 3600);
            var m = Math.floor((s % 3600) / 60);
            var sec = s % 60;
            var pad = function (n) { return (n < 10 ? '0' : '') + n; };
            return h > 0 ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
        }

        function forgetViewing() {
            seen = Object.create(null);
            seenAtLoad = Object.create(null);
            resumePoints = Object.create(null);
            stopProgressTracking();
            var store = storage();
            if (store) {
                try {
                    store.removeItem(SEEN_KEY);
                    store.removeItem(RESUME_KEY);
                } catch (e) {}
            }
            channels = Object.create(null);   // rebuild every running order
            current = null;
            tuneTo(channelIndex);
        }

        // Each channel keeps its own running order and its own cursor, and holds on
        // to them for the whole session. That's what makes the dial feel like a real
        // set: a channel is a thing that exists whether or not you're watching it,
        // not a list that restarts every time you look. See tuneTo() for the part
        // that makes it feel *live*.
        var channels = Object.create(null);   // id -> { queue: [], index: 0 }
        var current = null;                   // the channel state we're watching
        var channelIndex = 0;

        var player = null;
        var playerReady = false;
        var muted = true;        // start muted so autoplay is never blocked
        var pendingVideo = null; // set before the player exists
        var pendingStartAt = 0;  // resume position for that pending video

        // True only while a video is meant to be on screen. The player keeps
        // emitting state changes after we stop it -- stopVideo() alone reports CUED,
        // which looks identical to "a video just loaded fine". Without this flag
        // those stray events hide the bulletin or the off-air card and restart
        // playback underneath them.
        var expectingPlayback = false;

        // Videos that would not play in this session. Availability is not a property
        // we can check once at add-time: a video can be pulled, go private, or become
        // embed-restricted long after it lands in the playlist. So the player treats
        // every failure as "this channel just doesn't carry that one" and rolls on.
        var deadVideos = Object.create(null);

        // How we decide a video is dead. Error codes turn out to be untrustworthy —
        // YouTube fires 153 (a referrer/origin check) on perfectly healthy videos, so
        // acting on the error alone would blank out the whole playlist. What actually
        // separates a good video from a dead one is simple: a good one starts
        // playing. So every load arms a watchdog, and reaching PLAYING disarms it.
        // An error doesn't condemn the video, it just shortens its grace period.
        var WATCHDOG_MS = 9000;       // no error seen; allow for slow buffering
        var WATCHDOG_AFTER_ERROR_MS = 2500;
        var watchdog = null;
        var watchdogVideoId = null;

        function armWatchdog(videoId, delay) {
            clearTimeout(watchdog);
            watchdogVideoId = videoId;
            watchdog = setTimeout(function () {
                if (watchdogVideoId === videoId) markDeadAndSkip(videoId);
            }, delay);
        }

        function disarmWatchdog() {
            clearTimeout(watchdog);
            watchdog = null;
            watchdogVideoId = null;
        }

        var el = {
            info: document.getElementById('videoInfo'),
            card: document.getElementById('screenCard'),
            cardTitle: document.getElementById('cardTitle'),
            cardSub: document.getElementById('cardSub'),
            snow: document.getElementById('snowCanvas'),
            psa: document.getElementById('psaScreen'),
            psaBody: document.getElementById('psaBody'),
            psaStamp: document.getElementById('psaStamp'),
            forget: document.getElementById('forgetLink'),
            channelValue: document.getElementById('channelValue'),
            channelKnob: document.getElementById('channelKnob'),
            volumeValue: document.getElementById('volumeValue'),
            volumeKnob: document.getElementById('volumeKnob')
        };

        // ---- Playlist loading ----------------------------------------------------
        function loadPlaylist() {
            return fetch('playlist.json', { cache: 'no-store' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) {
                    library = (data.playlist || []).filter(function (v) {
                        return v && typeof v.videoId === 'string' && v.videoId.length > 0;
                    });
                    psa = data.psa || null;
                });
        }

        function shuffle(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
            }
            return arr;
        }

        // Built once per channel per session and then left alone. Reshuffling on every
        // visit would throw away the cursor and let you land on something you just
        // watched -- the exact thing the dial is supposed to avoid.
        function stateFor(ch) {
            if (channels[ch.id]) return channels[ch.id];

            // A text channel has no running order to keep -- it shows whatever is
            // currently posted, or nothing.
            if (ch.kind === 'text') {
                channels[ch.id] = { kind: 'text', queue: [], index: 0, seen: 0, offAir: false };
                return channels[ch.id];
            }

            var items = library.filter(function (v) {
                if (deadVideos[v.videoId]) return false;
                if (!ch.tag) return true;
                return Array.isArray(v.tags) && v.tags.indexOf(ch.tag) !== -1;
            });

            // Split on what this viewer has already watched, order each half by the
            // channel's own rule, then put the unseen half first, so the freshest
            // thing you haven't seen always leads.
            var fresh = [];
            var repeats = [];
            items.forEach(function (v) {
                (wasSeen(v.videoId) ? repeats : fresh).push(v);
            });

            if (ch.order === 'newest') {
                var byDate = function (a, b) {
                    return String(b.addedAt || '').localeCompare(String(a.addedAt || ''));
                };
                fresh.sort(byDate);
                repeats.sort(byDate);
            } else {
                shuffle(fresh);
                shuffle(repeats);
            }

            var allowRepeats = ch.repeat !== false;

            channels[ch.id] = {
                queue: allowRepeats ? fresh.concat(repeats) : fresh,
                index: 0,
                seen: 0,
                offAir: false,
                allowRepeats: allowRepeats,
                resume: ch.resume === true,
                // Distinguishes "this channel carries nothing" from "you've watched
                // everything it carries" -- the viewer deserves a different sentence
                // for each.
                caughtUp: !allowRepeats && fresh.length === 0 && repeats.length > 0
            };
            return channels[ch.id];
        }

        // Coming back to a channel that finished its run starts a fresh broadcast:
        // new shuffle, cursor back to the top. This is also what stops a long visit
        // from looping the same fixed order forever.
        function signBackOn(ch, state) {
            // Rebuild rather than just reshuffle: anything watched during this
            // session should now sort to the back like any other repeat, and a
            // non-repeating channel needs to re-check whether anything is still
            // unseen before it claims to have programming.
            delete channels[ch.id];
            var rebuilt = stateFor(ch);
            state.queue = rebuilt.queue;
            state.allowRepeats = rebuilt.allowRepeats;
            state.caughtUp = rebuilt.caughtUp;
            channels[ch.id] = state;
            state.index = 0;
            state.seen = 0;
            state.offAir = rebuilt.caughtUp;
        }

        // ---- The screen card -----------------------------------------------------
        // Dead air is a real part of watching television, so the empty states get the
        // same care as the programming. Which backdrop appears is random, because a
        // station that always failed the same way would stop feeling like a station.
        var CARD_MODES = ['bars', 'snow', 'testcard'];

        // Sign-off lines, drawn at random. Kept short so they read at a glance on the
        // small screen, and worded like a caption a station would actually run.
        var SIGN_OFF = [
            'We now conclude our broadcast day',
            'That concludes our programming',
            'This channel has gone off air',
            'End of transmission'
        ];
        var TROUBLE = [
            'Technical difficulties',
            'Please stand by',
            'Do not adjust your set',
            'Normal service will resume shortly'
        ];

        // Running out of *new* things is not a fault and shouldn't borrow the
        // language of one. It's the station telling you you're up to date.
        var CAUGHT_UP = [
            'You have seen everything new',
            'Nothing new since your last visit',
            'You are up to date'
        ];

        function pick(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        // How often turning the dial puts on a show about it, and for how long.
        // Roughly one tune in six: often enough to be a character trait, rare
        // enough that it never feels like an obstacle between you and the video.
        var INTERSTITIAL_CHANCE = 0.17;
        var INTERSTITIAL_MS = 1500;
        var hasTuned = false;

        function showCard(opts) {
            stopSnow();
            var mode = opts.mode || pick(CARD_MODES);
            el.card.setAttribute('data-mode', mode);
            el.card.classList.add('visible');
            el.card.classList.toggle('holding', opts.holding !== false);
            el.cardTitle.textContent = opts.title;
            el.cardSub.textContent = opts.sub || '';
            if (mode === 'snow') startSnow();
        }

        function hideCard() {
            stopSnow();
            el.card.classList.remove('visible');
        }

        // ---- Snow ----------------------------------------------------------------
        // Drawn on a canvas at a deliberately low frame rate and a low resolution:
        // analogue snow was coarse and flickery, and rendering it at full detail
        // would look wrong as well as cost more than dead air deserves.
        var snowTimer = null;
        var SNOW_W = 160, SNOW_H = 96, SNOW_FPS = 12;

        function startSnow() {
            var canvas = el.snow;
            canvas.width = SNOW_W;
            canvas.height = SNOW_H;
            var ctx = canvas.getContext('2d');
            var image = ctx.createImageData(SNOW_W, SNOW_H);

            function frame() {
                var data = image.data;
                for (var i = 0; i < data.length; i += 4) {
                    var v = (Math.random() * 255) | 0;
                    data[i] = data[i + 1] = data[i + 2] = v;
                    data[i + 3] = 255;
                }
                ctx.putImageData(image, 0, 0);
            }
            frame();
            snowTimer = setInterval(frame, 1000 / SNOW_FPS);
        }

        function stopSnow() {
            if (snowTimer) { clearInterval(snowTimer); snowTimer = null; }
        }

        // ---- Bulletin ------------------------------------------------------------
        // Expiry is decided here, in the viewer's browser, rather than by anything
        // deleting the record. That's what lets a bulletin age out on a static site
        // with nothing running server-side: the text stays in playlist.json until
        // it's cleared by hand, but stops being broadcast the moment it's stale.
        var PSA_DEFAULT_HOURS = 24;

        function activePsa() {
            if (!psa || !psa.text) return null;
            var posted = new Date(psa.postedAt);
            if (isNaN(posted)) return null;
            var hours = typeof psa.hours === 'number' ? psa.hours : PSA_DEFAULT_HOURS;
            var ageHours = (Date.now() - posted.getTime()) / 3600000;
            return ageHours < hours ? psa : null;
        }

        function hidePsa() {
            el.psa.classList.remove('visible');
        }

        function renderPsa() {
            disarmWatchdog();
            expectingPlayback = false;
            hideCard();
            if (player && playerReady) player.stopVideo();


            var live = activePsa();
            if (!live) {
                hidePsa();
                el.info.textContent = 'Bulletin — nothing posted';
                showCard({
                    mode: 'testcard',
                    title: 'No bulletin at this time',
                    sub: 'Turn the dial to keep watching'
                });
                return;
            }

            var posted = new Date(live.postedAt);
            el.psaBody.textContent = live.text;
            el.psaStamp.textContent = posted.toLocaleString(undefined, {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            el.psa.classList.add('visible');
            el.info.textContent = 'Bulletin';
        }

        // ---- Playback ------------------------------------------------------------
        // Nothing scheduled here at all -- the channel exists on the dial but no
        // video carries its tag. Different from having watched everything, and worth
        // saying differently.
        function showEmptyChannel() {
            disarmWatchdog();
            expectingPlayback = false;
            hidePsa();
            if (player && playerReady) player.stopVideo();

            // "You've watched it all" and "there's nothing here" look identical on a
            // dead screen, but they mean opposite things to the viewer -- one is an
            // achievement, the other is an empty channel.
            if (current && current.caughtUp) {
                el.info.textContent = CHANNELS[channelIndex].label + ' — all caught up';
                showCard({
                    mode: Math.random() < 0.5 ? 'bars' : 'testcard',
                    title: pick(CAUGHT_UP),
                    sub: 'Try another channel · new programmes appear here'
                });
                return;
            }

            el.info.textContent = CHANNELS[channelIndex].label + ' — no programming';
            showCard({
                title: pick(TROUBLE),
                sub: 'Nothing scheduled on this channel · turn the dial'
            });
        }

        // The channel played everything it had. This is a sign-off, not a fault.
        function showSignOff() {
            disarmWatchdog();
            expectingPlayback = false;
            hidePsa();
            if (player && playerReady) player.stopVideo();

            var caught = current && current.caughtUp;
            el.info.textContent = CHANNELS[channelIndex].label +
                (caught ? ' — all caught up' : ' — off air');
            showCard({
                mode: Math.random() < 0.5 ? 'bars' : 'testcard',
                title: pick(caught ? CAUGHT_UP : SIGN_OFF),
                sub: caught ? 'Try another channel · new programmes appear here'
                            : 'Turn the dial to keep watching'
            });
        }

        function deadEnd() {
            if (current && current.offAir) showSignOff();
            else showEmptyChannel();
        }

        function playCurrent() {
            if (!current) { showEmptyChannel(); return; }
            if (current.kind === 'text') { renderPsa(); return; }
            if (!current.queue.length) { showEmptyChannel(); return; }
            if (current.offAir) { showSignOff(); return; }

            var video = current.queue[current.index];

            // Work out whether this is a pick-up-where-you-left-off.
            var startAt = 0;
            var record = resumePoints[video.videoId];
            if (current.resume && record &&
                record.n < MAX_RESUMES && record.t > RESUME_MIN_SECONDS) {
                startAt = record.t;
            }

            var label = video.title || video.videoId;
            if (startAt) {
                label += '  ·  resuming at ' + formatClock(startAt);
            } else if (isRepeat(video.videoId)) {
                label += '  ·  repeat';
            }
            el.info.textContent = label;

            hideCard();
            hidePsa();

            if (startAt) {
                // Spending a resume happens on the attempt, not on finishing: the
                // count is there to stop an unfinished film following the viewer
                // around, and stalling at the same point six times still means
                // they're not watching it.
                record.n += 1;
                saveResume();
                if (record.n >= MAX_RESUMES) {
                    // Last go. After this the film joins the watched pile and the
                    // channel stops treating it as unfinished business.
                    markSeen(video.videoId);
                }
            }

            expectingPlayback = true;
            if (!playerReady) {
                pendingVideo = video;
                pendingStartAt = startAt;
                return;
            }
            player.loadVideoById({ videoId: video.videoId, startSeconds: startAt });
            armWatchdog(video.videoId, WATCHDOG_MS);
        }

        // Move the current channel's cursor forward. Used when a video ends on its
        // own, and when you tune away (see tuneTo). Once the cursor has been moved
        // past every video the channel carries, the channel is out of programming
        // and signs off rather than quietly looping back to the top.
        function advanceCursor() {
            if (!current || !current.queue.length) return;
            current.seen++;

            // A repeating channel never runs out -- it comes back round, with the
            // already-watched videos sorted to the back where they belong.
            if (current.allowRepeats) {
                current.index = (current.index + 1) % current.queue.length;
                return;
            }

            // A non-repeating channel carries only what's new to this viewer, so
            // reaching the end of it means there is genuinely nothing left to show.
            if (current.seen >= current.queue.length) {
                current.offAir = true;
                current.caughtUp = true;
                return;
            }
            current.index = (current.index + 1) % current.queue.length;
        }

        function markDeadAndSkip(videoId) {
            disarmWatchdog();
            if (!current) return;

            var queue = current.queue;
            var pos = -1;
            for (var i = 0; i < queue.length; i++) {
                if (queue[i].videoId === videoId) { pos = i; break; }
            }
            if (pos === -1) return;

            console.warn('ThiagoTV: skipping unavailable video', videoId, queue[pos].title || '');
            deadVideos[videoId] = true;

            // Pull it out of every channel that carries it, not just this one -- a
            // video that won't play here won't play on the Music channel either.
            Object.keys(channels).forEach(function (id) {
                var st = channels[id];
                for (var j = st.queue.length - 1; j >= 0; j--) {
                    if (st.queue[j].videoId !== videoId) continue;
                    st.queue.splice(j, 1);
                    // Removing an entry shifts everything after it down, so a cursor
                    // sitting past the removal has to follow it back.
                    if (j < st.index) st.index--;
                    if (st.index >= st.queue.length) st.index = 0;
                }
            });

            if (!current.queue.length) { deadEnd(); return; }
            showCard({ mode: 'snow', title: 'Please stand by', holding: false });
            setTimeout(playCurrent, 400);
        }

        // ---- Channels ------------------------------------------------------------
        // The dial is the only way to move. Tuning away burns the video you were on,
        // so coming back lands on the next one instead of replaying what you already
        // sat through -- the channel behaves as though it kept broadcasting while you
        // were elsewhere.
        function tuneTo(index) {
            disarmWatchdog();
            captureProgress();          // before anything else moves
            stopProgressTracking();
            if (current) advanceCursor();

            channelIndex = (index + CHANNELS.length) % CHANNELS.length;
            var ch = CHANNELS[channelIndex];
            current = stateFor(ch);

            // A channel you left off air has had time to start its next broadcast.
            if (current.offAir) signBackOn(ch, current);

            el.channelValue.textContent = ch.label;
            el.channelKnob.style.setProperty(
                '--knob-angle',
                (channelIndex * (300 / CHANNELS.length)) + 'deg'
            );

            // A beat of snow between channels: the gap is what sells the dial.
            //
            // Now and then the set makes more of a meal of it -- a burst of colour
            // bars or a "do not adjust your set" card before the picture arrives.
            // Nothing is wrong when this happens; old televisions were just like
            // that, and the cards are too good to save for failures. It stays rare,
            // stays brief, and never greets a first-time visitor, because an opening
            // screen of technical difficulties reads as a broken site rather than a
            // joke.
            var theatrical = hasTuned && Math.random() < INTERSTITIAL_CHANCE;
            hasTuned = true;

            if (theatrical) {
                showCard({
                    mode: Math.random() < 0.5 ? 'bars' : 'testcard',
                    title: pick(TROUBLE),
                    sub: 'Tuning to ' + ch.label
                });
                setTimeout(playCurrent, INTERSTITIAL_MS);
                return;
            }

            showCard({ mode: 'snow', title: 'Tuning', sub: ch.label, holding: false });
            setTimeout(playCurrent, 400);
        }

        // ---- Volume --------------------------------------------------------------
        // The knob is a mute toggle. Starting muted is what lets the TV switch itself
        // on without the browser blocking autoplay; one click turns the sound on.
        function setMuted(next) {
            muted = next;
            el.volumeValue.textContent = muted ? 'Muted' : 'On';
            el.volumeKnob.style.setProperty('--knob-angle', muted ? '0deg' : '120deg');
            if (player && playerReady) {
                if (muted) player.mute(); else { player.unMute(); player.setVolume(80); }
            }
        }

        // ---- YouTube IFrame API --------------------------------------------------
        // The plain <iframe> embed gives us no error signal — a dead video just shows
        // "Video unavailable" and sits there. The IFrame API fires onError instead,
        // which is the whole reason we drive the player through it.
        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1
                },
                events: {
                    onReady: function () {
                        playerReady = true;
                        setMuted(true);
                        if (pendingVideo) {
                            expectingPlayback = true;
                            player.loadVideoById({
                                videoId: pendingVideo.videoId,
                                startSeconds: pendingStartAt
                            });
                            armWatchdog(pendingVideo.videoId, WATCHDOG_MS);
                            pendingVideo = null;
                            pendingStartAt = 0;
                        } else {
                            playCurrent();
                        }
                    },
                    onStateChange: function (e) {
                        // Ignore everything the player says once we've moved off a
                        // video -- those events are echoes of us stopping it, not
                        // news about something the viewer is watching.
                        if (!expectingPlayback) return;

                        // Any state that means "the video loaded" clears the watchdog.
                        // PLAYING is the obvious one, but CUED and PAUSED matter just
                        // as much: if the browser refuses to autoplay, the video sits
                        // there perfectly healthy at 0:00, and condemning it would
                        // wipe out the whole channel one video at a time.
                        if (e.data === YT.PlayerState.PLAYING ||
                            e.data === YT.PlayerState.PAUSED ||
                            e.data === YT.PlayerState.CUED) {
                            disarmWatchdog();
                            hideCard();
                        }

                        // Only actually playing counts as watched. Recording it on
                        // load would mean a video the viewer never saw -- because
                        // they tuned straight past it -- would never come round
                        // again.
                        if (e.data === YT.PlayerState.PLAYING &&
                            current && current.queue.length) {
                            var playing = current.queue[current.index];
                            markSeen(playing.videoId);
                            if (current.resume) startProgressTracking(playing.videoId);
                        }
                        // Nudge a cued video into playing. Muted playback is normally
                        // allowed; if it still won't start, the viewer can hit play.
                        if (e.data === YT.PlayerState.CUED) player.playVideo();
                        if (e.data === YT.PlayerState.ENDED) {
                            disarmWatchdog();
                            stopProgressTracking();
                            // Watched to the end, so there's nothing to come back to.
                            if (current && current.queue.length) {
                                clearResume(current.queue[current.index].videoId);
                            }
                            advanceCursor();
                            playCurrent();
                        }
                    },
                    onError: function (e) {
                        // Don't act on the code — 153 in particular fires on healthy
                        // videos. Just give this one a much shorter rope and let the
                        // watchdog decide.
                        if (!expectingPlayback) return;
                        if (!current || !current.queue.length) return;
                        var video = current.queue[current.index];
                        console.warn('ThiagoTV: player error', e.data, 'on', video.videoId);
                        armWatchdog(video.videoId, WATCHDOG_AFTER_ERROR_MS);
                    }
                }
            });
        };

        function injectApi() {
            var tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        }

        // ---- Wire up -------------------------------------------------------------
        el.channelKnob.addEventListener('click', function () { tuneTo(channelIndex + 1); });
        el.volumeKnob.addEventListener('click', function () { setMuted(!muted); });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowUp') tuneTo(channelIndex + 1);
            else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') tuneTo(channelIndex - 1);
            else if (e.key.toLowerCase() === 'm') setMuted(!muted);
        });

        el.forget.addEventListener('click', function (e) {
            e.preventDefault();
            forgetViewing();
            el.forget.textContent = 'Viewing history cleared';
            setTimeout(function () {
                el.forget.textContent = 'Reset viewing history';
            }, 2600);
        });

        // Closing the tab and switching away are both "I'm done for now", and both
        // need the position written before the page stops running. visibilitychange
        // is the reliable one on mobile, where pagehide often never fires.
        window.addEventListener('pagehide', captureProgress);
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') captureProgress();
        });

        loadSeen();
        loadResume();
        loadPlaylist()
            .then(function () {
                tuneTo(0);
                injectApi();
            })
            .catch(function (err) {
                console.error('ThiagoTV: could not load playlist.json', err);
                showCard({
                    mode: 'testcard',
                    title: 'Technical difficulties',
                    sub: 'Could not load the schedule'
                });
                el.info.textContent = 'Could not load playlist.json';
            });
    })();
    </script>
</body>
</html>
