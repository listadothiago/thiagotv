                if (!wasSeen(video.videoId)) return;
                current.queue.splice(current.index, 1);
                if (!current.queue.length) break;
                if (current.index >= current.queue.length) current.index = 0;
            }
            if (!current.queue.length) current.caughtUp = true;
        }

        function playCurrent() {
            if (!current) { showEmptyChannel(); return; }
            if (current.kind === 'text') { renderPsa(); return; }

            dropBurnedOut();
            dropAlreadySeen();

            if (!current.queue.length) {
                // Everything this channel carried has either been watched or given
                // up on, which is the same thing as being caught up.
                current.caughtUp = true;
                showEmptyChannel();
                return;
            }
            if (current.offAir) { showSignOff(); return; }

            var video = current.queue[current.index];

            // Work out whether this is a pick-up-where-you-left-off.
            var startAt = 0;
            var record = resumePoints[video.videoId];
            if (record && record.t > RESUME_MIN_SECONDS &&
                (forceResume || (current.resume && record.n < MAX_RESUMES))) {
                startAt = record.t;
            }
            var wasForced = forceResume;
            forceResume = false;

            var label = video.title || video.videoId;
            if (startAt) {
                label += '  ·  resuming at ' + formatClock(startAt);
            } else if (isRepeat(video.videoId)) {
                label += '  ·  repeat';
            }
            el.info.textContent = label;
            el.nowLink.href = 'v/' + video.videoId + '.html';
            el.nowRow.classList.remove('hidden');

            hideCard();
            hidePsa();

            if (startAt && !wasForced) {
                // Spending a chance happens on the attempt, not on finishing:
                // the count exists to stop an unfinished video following the
                // viewer around, and stalling at the same point again still
                // means they aren't watching it.
                record.n += 1;
                saveResume();
                if (record.n >= MAX_RESUMES) {
                    // Last go. After this the film joins the watched pile and the
                    // channel stops treating it as unfinished business.
                    markSeen(video.videoId);
                }
            }

            expectingPlayback = true;
            stalls = 0;
            if (!playerReady) {
                pendingVideo = video;
                pendingStartAt = startAt;
                return;
            }
            player.loadVideoById({ videoId: video.videoId, startSeconds: startAt });
            armWatchdog(video.videoId, WATCHDOG_MS);
        }

        // Move the current channel's cursor forward. Used when a video ends on its
        // own, and when you tune away (see tuneTo). Once the cursor has been moved
        // past every video the channel carries, the channel is out of programming
        // and signs off rather than quietly looping back to the top.
        function advanceCursor() {
            if (!current || !current.queue.length) return;
            current.seen++;

            // A repeating channel never runs out -- it comes back round, with the
            // already-watched videos sorted to the back where they belong.
            if (current.allowRepeats) {
                current.index = (current.index + 1) % current.queue.length;
                return;
            }

            // A non-repeating channel carries only what's new to this viewer, so
            // reaching the end of it means there is genuinely nothing left to show.
            if (current.seen >= current.queue.length) {
                current.offAir = true;
                current.caughtUp = true;
                return;
            }
            current.index = (current.index + 1) % current.queue.length;
        }

        function markDeadAndSkip(videoId) {
            disarmWatchdog();
            // A break that won't play is simply skipped; it isn't part of any
            // channel's running order, so there is nothing to remove it from.
            if (inBreak && videoId === currentBreakId) {
                deadVideos[videoId] = true;
                endBreak();
                return;
            }
            if (!current) return;

            var queue = current.queue;
            var pos = -1;
            for (var i = 0; i < queue.length; i++) {
                if (queue[i].videoId === videoId) { pos = i; break; }
            }
            if (pos === -1) return;

            console.warn('ThiagoTV: skipping unavailable video', videoId, queue[pos].title || '');
            deadVideos[videoId] = true;

            // Pull it out of every channel that carries it, not just this one -- a
            // video that won't play here won't play on the Music channel either.
            Object.keys(channels).forEach(function (id) {
                var st = channels[id];
                for (var j = st.queue.length - 1; j >= 0; j--) {
                    if (st.queue[j].videoId !== videoId) continue;
                    st.queue.splice(j, 1);
                    // Removing an entry shifts everything after it down, so a cursor
                    // sitting past the removal has to follow it back.
                    if (j < st.index) st.index--;
                    if (st.index >= st.queue.length) st.index = 0;
                }
            });

            if (!current.queue.length) { deadEnd(); return; }
            showCard({ mode: 'snow', title: 'Please stand by', holding: false });
            setTimeout(playCurrent, 400);
        }

        // ---- Channels ------------------------------------------------------------
        // The dial is the only way to move. Tuning away burns the video you were on,
        // so coming back lands on the next one instead of replaying what you already
        // sat through -- the channel behaves as though it kept broadcasting while you
        // were elsewhere.
        // Where the viewer came from, so anticlockwise can actually retrace it.
        // The dial order alone isn't enough: turning back should return you to the
        // channel you were on before, at the video you were on, at the second you
        // left it -- which is a different question from "what is one position
        // anticlockwise on the dial".
        var channelHistory = [];

        // The pointer's rotation is cumulative rather than derived from which
        // channel is showing. Deriving it from the index looks wrong the moment
        // the dial wraps or the viewer retraces their steps: the shortest path
        // between two angles is often the opposite of the way they just turned
        // it, so the pointer would visibly spin backwards while the channel went
        // forwards. Counting turns instead means it always moves the way it was
        // pushed, by exactly one notch.
        var KNOB_STEP = 300 / CHANNELS.length;
        var knobRotation = 0;

        function turnKnob(direction) {
            knobRotation += direction * KNOB_STEP;
            el.channelKnob.style.setProperty('--knob-angle', knobRotation + 'deg');
        }

        function placeKnob(index) {
            knobRotation = index * KNOB_STEP;
            el.channelKnob.style.setProperty('--knob-angle', knobRotation + 'deg');
        }

        function tuneForward() {
            if (current && powered) {
                captureProgress();
                var v = current.queue.length ? current.queue[current.index] : null;
                channelHistory.push({
                    channelIndex: channelIndex,
                    queueIndex: current.index,
                    videoId: v ? v.videoId : null
                });
                if (channelHistory.length > 40) channelHistory.shift();
            }
            tuneTo(channelIndex + 1, 1);
        }

        function tuneBack() {
            // Nothing to retrace: fall back to simply turning the dial the other
            // way, which is what a viewer expects a knob to do.
            if (!channelHistory.length) { tuneTo(channelIndex - 1, -1); return; }

            var back = channelHistory.pop();
            captureProgress();
            disarmWatchdog();
            stopProgressTracking();
            // Deliberately no advanceCursor here. Going back is a return, and
            // burning the video you are returning to would defeat the point.

            channelIndex = back.channelIndex;
            var ch = CHANNELS[channelIndex];
            current = stateFor(ch);
            current.offAir = false;

            // Find the video again by id rather than by position: the running
            // order can have lost entries to dead videos since you left.
            var pos = -1;
            for (var i = 0; i < current.queue.length; i++) {
                if (current.queue[i].videoId === back.videoId) { pos = i; break; }
            }
            if (pos === -1) pos = Math.min(back.queueIndex, Math.max(0, current.queue.length - 1));
            current.index = pos;

            forceResume = true;   // pick it up exactly, whatever the attempt count says

            showChannelName(ch);
            turnKnob(-1);
            showCard({ mode: 'snow', title: 'Tuning', holding: false });
            setTimeout(playCurrent, 400);
        }

        // Which way the viewer just turned the knob.
        //
        // Not left half versus right half -- that is a pair of buttons wearing a
        // knob's clothes, and it ignores where the pointer actually is. This asks
        // the only question that matters on a real dial: is the place you grabbed
        // ahead of the marker, or behind it? Clicking just clockwise of the
        // pointer turns it forward; clicking behind it turns it back. Which means
        // the same spot on the knob does opposite things depending on where the
        // marker currently sits, exactly as your hand would expect.
        function angleOfClick(event, node) {
            var r = node.getBoundingClientRect();
            var dx = event.clientX - (r.left + r.width / 2);
            var dy = event.clientY - (r.top + r.height / 2);
            // Screen y grows downward, and the marker's zero points straight up,
            // so measure clockwise from twelve o'clock.
            return (Math.atan2(dx, -dy) * 180 / Math.PI + 360) % 360;
        }

        function markerAngle(node) {
            var raw = parseFloat(node.style.getPropertyValue('--knob-angle')) || 0;
            return ((raw % 360) + 360) % 360;
        }

        var coarsePointer = window.matchMedia &&
            window.matchMedia('(pointer: coarse)').matches;

        function clickDirection(event, node) {
            // A finger on a knob a couple of centimetres wide cannot aim precisely
            // enough for the angle to mean anything -- the same tap reads as
            // forward or backward depending on a few pixels. Touch gets the plain
            // answer: left half back, right half forward.
            if (coarsePointer) {
                var box = node.getBoundingClientRect();
                return (event.clientX - box.left) < box.width / 2 ? -1 : 1;
            }
            var delta = angleOfClick(event, node) - markerAngle(node);
            delta = ((delta % 360) + 360) % 360;      // 0..360, clockwise from marker
            if (delta === 0) return 1;
            // Anything within half a turn clockwise of the marker reads as
            // forward; the rest of the circle is behind it.
            return delta < 180 ? 1 : -1;
        }

        function tuneTo(index, spin) {
            disarmWatchdog();
            inBreak = false; currentBreakId = null; breakReturn = null;
            captureProgress();          // before anything else moves
            stopProgressTracking();
            if (current) advanceCursor();

            channelIndex = (index + CHANNELS.length) % CHANNELS.length;
            var ch = CHANNELS[channelIndex];
            current = stateFor(ch);

            // A channel you left off air has had time to start its next broadcast.
            if (current.offAir) signBackOn(ch, current);

            showChannelName(ch);
            if (spin) turnKnob(spin); else placeKnob(channelIndex);

            // A beat of snow between channels: the gap is what sells the dial.
            //
            // Now and then the set makes more of a meal of it -- a burst of colour
            // bars or a "do not adjust your set" card before the picture arrives.
            // Nothing is wrong when this happens; old televisions were just like
            // that, and the cards are too good to save for failures. It stays rare,
            // stays brief, and never greets a first-time visitor, because an opening
            // screen of technical difficulties reads as a broken site rather than a
            // joke.
            var theatrical = hasTuned && Math.random() < INTERSTITIAL_CHANCE;
            hasTuned = true;

            if (theatrical) {
                showCard({
                    mode: Math.random() < 0.5 ? 'bars' : 'testcard',
                    title: pick(TROUBLE),
                    sub: 'Stand by'
                });
                setTimeout(playCurrent, INTERSTITIAL_MS);
                return;
            }

            showCard({ mode: 'snow', title: 'Tuning', holding: false });
            setTimeout(playCurrent, 400);
        }

        // ---- Volume --------------------------------------------------------------
        // The knob is a mute toggle. Starting muted is what lets the TV switch itself
        // on without the browser blocking autoplay; one click turns the sound on.
        // ---- Interstitials -------------------------------------------------------
        // Short things that play between programmes rather than on a channel of
        // their own: the adverts and idents a station used to fill the seams with.
        // They are not programmes, so they are not remembered as watched, do not
        // appear in the guide as broadcasts, and never occupy a dial position.
        //
        // Length is checked when one loads rather than measured in advance.
        // YouTube will not tell you a duration without either an API key or
        // scraping every watch page, and scraping 141 of them in a row simply
        // gets you rate-limited -- whereas the player already knows, the instant
        // it has the video. Anything too long is dropped on the spot and
        // remembered, so it is only ever tried once.
        var INTERSTITIAL_TAGS = ['ads', 'vignette'];
        var INTERSTITIAL_ODDS = 0.35;      // between one programme and the next
        var INTERSTITIAL_MAX_SECONDS = 60;

        var tooLong = Object.create(null);   // ids proven unsuitable this session
        var inBreak = false;                 // a break is on screen right now
        var breakReturn = null;              // what to play when it finishes

        function interstitialPool() {
            return library.filter(function (v) {
                if (deadVideos[v.videoId] || tooLong[v.videoId]) return false;
                var tags = v.tags || [];
                for (var i = 0; i < INTERSTITIAL_TAGS.length; i++) {
                    if (tags.indexOf(INTERSTITIAL_TAGS[i]) !== -1) return true;
                }
                return false;
            });
        }

        function pickInterstitial() {
            var pool = interstitialPool();
            if (!pool.length) return null;
            return pool[Math.floor(Math.random() * pool.length)];
        }

        // Called when a programme ends. Returns true if a break took the screen.
        function maybeTakeABreak(resume) {
            if (inBreak || !powered) return false;
            if (Math.random() >= INTERSTITIAL_ODDS) return false;
            var spot = pickInterstitial();
            if (!spot) return false;

            inBreak = true;
            breakReturn = resume;
            expectingPlayback = true;
            stalls = 0;
            hideCard();
            hidePsa();
            el.info.textContent = spot.title || spot.videoId;
            el.nowRow.classList.add('hidden');   // a break is not a programme
            try {
                player.loadVideoById({ videoId: spot.videoId, startSeconds: 0 });
            } catch (e) { endBreak(); return true; }
            armWatchdog(spot.videoId, WATCHDOG_MS);
            currentBreakId = spot.videoId;
            return true;
        }

        var currentBreakId = null;

        function endBreak() {
            inBreak = false;
            currentBreakId = null;
            var next = breakReturn;
            breakReturn = null;
            if (typeof next === 'function') next(); else playCurrent();
        }

        // The moment the player knows how long the break is, judge it. A minute is
        // the line: past that it stops being a seam and becomes the programme.
        function checkBreakLength() {
            if (!inBreak || !currentBreakId) return;
            var d;
            try { d = player.getDuration(); } catch (e) { return; }
            if (!d) return;
            if (d > INTERSTITIAL_MAX_SECONDS) {
                console.warn('ThiagoTV: too long for a break (' + Math.round(d) + 's)', currentBreakId);
                tooLong[currentBreakId] = true;
                endBreak();
            }
        }

        // ---- Sound of the set ----------------------------------------------------
        // Synthesised rather than loaded: a handful of short noises are not worth
        // an audio file each, and keeping them in code keeps the whole site two
        // static documents. The context is created on the first gesture because
        // browsers refuse to start audio before one -- the power switch is always
        // that gesture, since nothing else can happen until the set is on.
        //
        // These are room noises, not programme audio, so they are deliberately
        // not tied to the volume knob: muting a television silences the
        // broadcast, not the clunk of its switches. They are quiet enough that
        // the distinction never becomes annoying.
        var audio = null;

        function audioContext() {
            if (audio) return audio;
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return null;
            try { audio = new Ctx(); } catch (e) { return null; }
            return audio;
        }

        // A detent: a very short burst of filtered noise, which is what a plastic
        // knob passing a notch actually sounds like.
        function clickSound(pitch, level, length) {
            var ctx = audioContext();
            if (!ctx) return;
            try {
                var frames = Math.floor(ctx.sampleRate * length);
                var buffer = ctx.createBuffer(1, frames, ctx.sampleRate);
                var data = buffer.getChannelData(0);
                for (var i = 0; i < frames; i++) {
                    // Decaying noise: loud at the strike, gone almost at once.
                    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / frames, 3);
                }
                var src = ctx.createBufferSource();
                src.buffer = buffer;

                var band = ctx.createBiquadFilter();
                band.type = 'bandpass';
                band.frequency.value = pitch;
                band.Q.value = 1.1;

                var gain = ctx.createGain();
                gain.gain.value = level;

                src.connect(band); band.connect(gain); gain.connect(ctx.destination);
                src.start();
            } catch (e) { /* sound is never worth an exception */ }
        }

        // The power switch is heavier and mechanical, so it gets a body to it.
        function thunkSound(up) {
            var ctx = audioContext();
            if (!ctx) return;
            try {
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(up ? 150 : 110, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(up ? 70 : 45, ctx.currentTime + 0.09);
                gain.gain.setValueAtTime(0.09, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.13);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.14);
            } catch (e) {}
            clickSound(1800, 0.05, 0.02);
        }

        function knobClick()    { clickSound(2400, 0.055, 0.018); }
        function volumeClick()  { clickSound(3100, 0.04,  0.014); }

        // ---- Power ---------------------------------------------------------------
        // The set is off until the viewer switches it on, every visit. Not
        // remembered on purpose: switching it on is the interaction that lets the
        // browser start audio, so making it automatic would only bring back the
        // muted-first-video problem it exists to solve.
        var powered = false;

        function playCrt(animation) {
            var crt = el.crt;
            crt.classList.remove('firing', 'collapsing');
            void crt.offsetWidth;           // restart the animation
            crt.classList.add(animation);
        }

        function powerOn() {
            if (powered) return;
            powered = true;
            el.power.classList.add('on');
            el.power.setAttribute('aria-pressed', 'true');
            el.powerValue.textContent = 'On';
            el.screenOff.classList.add('hidden');
            playCrt('firing');

            // This runs inside a click, so the browser will allow sound. Apply the
            // viewer's actual preference rather than starting muted and hoping.
            applyVolume();
            // Switching on always lands on Latest. Resuming the channel you last
            // watched is remembering a session that already ended; switching on
            // starts a new one, and the first thing a new session should show is
            // what's new. Within a session the dial still remembers where you
            // were -- that is what the channel history is for.
            // Switching on starts a session, so the dial is rebuilt with it: every
            // channel gets a fresh running order, shuffles are reshuffled, and any
            // channel that had signed off is back on air. Without this, the state
            // left behind by the previous session survives the set being off --
            // which is how Latest could greet you with "all caught up" the moment
            // you switched on, instead of the newest programme.
            channelHistory = [];
            channels = Object.create(null);
            current = null;
            setTimeout(function () {
                tuneTo(0);
            }, 260);
        }

        function powerOff() {
            if (!powered) return;
            inBreak = false; currentBreakId = null; breakReturn = null;
            el.nowRow.classList.add('hidden');
            powered = false;
            el.power.classList.remove('on');
            el.power.setAttribute('aria-pressed', 'false');
            el.powerValue.textContent = 'Off';

            captureProgress();              // don't lose the place in a film
            stopProgressTracking();
            disarmWatchdog();
            expectingPlayback = false;
            if (player && playerReady) { try { player.stopVideo(); } catch (e) {} }
            hideCard();
            hidePsa();
            playCrt('collapsing');
            setTimeout(function () {
                el.screenOff.classList.remove('hidden');
            }, 380);
        }

        // Ramping rather than jumping: a hard cut between silence and full volume
        // is startling, and the knob is visibly sweeping, so the sound should too.
        var volumeRamp = null;

        function rampVolumeTo(target) {
            if (!player || !playerReady) return;
            clearInterval(volumeRamp);
            var from;
            try { from = player.isMuted() ? 0 : player.getVolume(); } catch (e) { from = 0; }
            if (target > 0) { try { player.unMute(); } catch (e) {} }

            var steps = 12, i = 0;
            volumeRamp = setInterval(function () {
                i++;
                var v = Math.round(from + (target - from) * (i / steps));
                try { player.setVolume(v); } catch (e) {}
                if (i >= steps) {
                    clearInterval(volumeRamp);
                    volumeRamp = null;
                    // Mute only once the fade has finished, so it isn't audible
                    // as a cut partway down.
                    if (target === 0) { try { player.mute(); } catch (e) {} }
                }
            }, 20);
        }

        function applyVolume() {
            var step = VOLUME_STEPS[volumeStep];
            muted = step.volume === 0;
            el.volumeValue.textContent = step.label;
            el.volumeKnob.style.setProperty('--knob-angle', step.angle + 'deg');
            rampVolumeTo(step.volume);
        }

        // Turning the knob is a deliberate choice, so it's the one that gets saved.
        // With both halves clickable there is no need to bounce off the ends any
        // more: left turns it down, right turns it up, and it stops at the stops
        // exactly as a real one would.
        var volumeUndo = [];      // recent positions, so a double-click can unwind
        var lastAudibleStep = 1;  // what to return to when unmuting

        function stepVolume(dir) {
            volumeUndo.push(volumeStep);
            if (volumeUndo.length > 4) volumeUndo.shift();
            var next = Math.max(0, Math.min(VOLUME_STEPS.length - 1, volumeStep + dir));
            volumeStep = next;
            if (volumeStep > 0) lastAudibleStep = volumeStep;
            rememberMutePreference();
            applyVolume();
        }

        // A double-click mutes and unmutes. The two single clicks have already
        // fired by the time this runs -- delaying them to find out would make
        // every ordinary click feel sluggish -- so it rewinds them first, then
        // does the thing that was actually asked for.
        function toggleMute() {
            var before = volumeUndo.length >= 2
                ? volumeUndo[volumeUndo.length - 2]
                : volumeStep;
            volumeUndo.length = Math.max(0, volumeUndo.length - 2);

            if (before === 0) {
                volumeStep = lastAudibleStep || 1;
            } else {
                lastAudibleStep = before;
                volumeStep = 0;
            }
            rememberMutePreference();
            applyVolume();
        }


        // ---- YouTube IFrame API --------------------------------------------------
        // The plain <iframe> embed gives us no error signal — a dead video just shows
        // "Video unavailable" and sits there. The IFrame API fires onError instead,
        // which is the whole reason we drive the player through it.
        window.onYouTubeIframeAPIReady = function () {
            player = new YT.Player('player', {
                width: '100%',
                height: '100%',
                playerVars: {
                    autoplay: 1,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1,
                    // Belt and braces with the glass above: even in the moments
                    // the player's own furniture might surface, there is less of
                    // it. controls stays on so the picture is never a dead
                    // rectangle if the glass ever fails to load.
                    iv_load_policy: 3,   // no annotation cards over the picture
                    disablekb: 1,        // arrow keys belong to the dial, not the player
                    fs: 0                // fullscreen is the browser's job here
                },
                events: {
                    onReady: function () {
                        playerReady = true;
                        applyVolume();
                        if (pendingVideo) {
                            expectingPlayback = true;
                            player.loadVideoById({
                                videoId: pendingVideo.videoId,
                                startSeconds: pendingStartAt
                            });
                            armWatchdog(pendingVideo.videoId, WATCHDOG_MS);
                            pendingVideo = null;
                            pendingStartAt = 0;
                        } else {
                            playCurrent();
                        }
                    },
                    onStateChange: function (e) {
                        // Ignore everything the player says once we've moved off a
                        // video -- those events are echoes of us stopping it, not
                        // news about something the viewer is watching.
                        if (!expectingPlayback) return;

                        // Any state that means "the video loaded" clears the watchdog.
                        // PLAYING is the obvious one, but CUED and PAUSED matter just
                        // as much: if the browser refuses to autoplay, the video sits
                        // there perfectly healthy at 0:00, and condemning it would
                        // wipe out the whole channel one video at a time.
                        if (e.data === YT.PlayerState.PLAYING ||
                            e.data === YT.PlayerState.PAUSED ||
                            e.data === YT.PlayerState.CUED) {
                            disarmWatchdog();
                            hideCard();
                        }

                        if (e.data === YT.PlayerState.PLAYING) {
                            stalls = 0;
                            if (inBreak) checkBreakLength();
                        }

                        // A television has no pause, and the glass over the screen
                        // means a viewer cannot press play either -- so a player
                        // that stops on its own would strand them in front of a
                        // frozen picture with YouTube's chrome sitting on top of
                        // it, which is exactly what the glass exists to prevent.
                        // Start it again. Bounded, because if the browser is
                        // refusing to play, retrying forever helps nobody.
                        if (e.data === YT.PlayerState.PAUSED && expectingPlayback) {
                            if (stalls < MAX_STALLS) {
                                stalls++;
                                setTimeout(function () {
                                    if (!expectingPlayback || !powered) return;
                                    try { player.playVideo(); } catch (err) {}
                                }, 350);
                            } else {
                                console.warn('ThiagoTV: player keeps stopping; leaving it be');
                            }
                        }

                        // Only actually playing counts as watched. Recording it on
                        // load would mean a video the viewer never saw -- because
                        // they tuned straight past it -- would never come round
                        // again.
                        if (e.data === YT.PlayerState.PLAYING && !inBreak &&
                            current && current.queue.length) {
                            var playing = current.queue[current.index];
                            markSeen(playing.videoId);
                            startProgressTracking(playing.videoId);
                        }
                        // Nudge a cued video into playing. Muted playback is normally
                        // allowed; if it still won't start, the viewer can hit play.
                        if (e.data === YT.PlayerState.CUED) player.playVideo();
                        if (e.data === YT.PlayerState.ENDED) {
                            disarmWatchdog();
                            stopProgressTracking();

                            // A break finishing just hands the screen back.
                            if (inBreak) { endBreak(); return; }

                            // Watched to the end, so there's nothing to come back to.
                            if (current && current.queue.length) {
                                clearResume(current.queue[current.index].videoId);
                            }
                            advanceCursor();
                            if (!maybeTakeABreak(playCurrent)) playCurrent();
                        }
                    },
                    onError: function (e) {
                        // Don't act on the code — 153 in particular fires on healthy
                        // videos. Just give this one a much shorter rope and let the
                        // watchdog decide.
                        if (!expectingPlayback) return;
                        if (!current || !current.queue.length) return;
                        var video = current.queue[current.index];
                        console.warn('ThiagoTV: player error', e.data, 'on', video.videoId);
                        armWatchdog(video.videoId, WATCHDOG_AFTER_ERROR_MS);
                    }
                }
            });
        };

        function injectApi() {
            var tag = document.createElement('script');
            tag.src = 'https://www.youtube.com/iframe_api';
            document.head.appendChild(tag);
        }

        // ---- Wire up -------------------------------------------------------------


        // ---- Fullscreen ---------------------------------------------------------
        // The browser only grants this from a gesture, which is why it is a button
        // rather than something the set decides on its own. Escape exits without
        // any help from us -- that behaviour belongs to the browser and overriding
        // it would only surprise people.
        //
        // The picture goes fullscreen, not the cabinet: filling a display with a
        // wooden frame around a small rectangle is the wrong trade. The dial is
        // out of reach while fullscreen, but the arrow keys still work, because
        // the keyboard listener is on the document and the document is still live.
        function toggleFullscreen() {
            var target = el.screenInner;
            if (!target) return;
            if (document.fullscreenElement) {
                (document.exitFullscreen || document.webkitExitFullscreen || function () {})
                    .call(document);
                return;
            }
            var request = target.requestFullscreen || target.webkitRequestFullscreen;
            if (!request) return;   // older Safari on iPhone simply cannot
            try {
                var result = request.call(target);
                if (result && result.catch) {
                    result.catch(function (err) {
                        console.warn('ThiagoTV: fullscreen refused', err);
                    });
                }
            } catch (e) {
                console.warn('ThiagoTV: fullscreen failed', e);
            }
        }

        el.fullscreen.addEventListener('click', function (e) {
            e.preventDefault();
            e.stopPropagation();
            toggleFullscreen();
        });

        // ---- Renaming a channel from the picture ---------------------------------
        // Double-click the name in the corner and type over it. Enter keeps it,
        // Escape drops it, and clearing the field puts the station's own name back.
        // Nothing leaves this browser -- see channelDisplayName().
        if (el.channelTag) {
            el.channelTag.addEventListener('dblclick', function (e) {
                e.preventDefault();
                if (renamingChannel) return;
                renamingChannel = true;
                this.setAttribute('data-editing', '');
                this.setAttribute('contenteditable', 'plaintext-only');
                this.focus();
                var range = document.createRange();
                range.selectNodeContents(this);
                var sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
            });

            el.channelTag.addEventListener('keydown', function (e) {
                if (!renamingChannel) return;
                e.stopPropagation();          // the dial keys stay out of this
                if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
                else if (e.key === 'Escape') {
                    e.preventDefault();
                    this.textContent = channelDisplayName(CHANNELS[channelIndex]);
                    this.blur();
                }
            });

            el.channelTag.addEventListener('blur', function () {
                if (!renamingChannel) return;
                renamingChannel = false;
                this.removeAttribute('data-editing');
                this.removeAttribute('contenteditable');
                window.getSelection().removeAllRanges();
                renameChannel(CHANNELS[channelIndex].id, this.textContent);
            });
        }

        el.power.addEventListener('click', function () {
            thunkSound(!powered);
            if (powered) powerOff(); else powerOn();
        });

        el.channelKnob.addEventListener('click', function (e) {
            knobClick();
            if (clickDirection(e, el.channelKnob) > 0) tuneForward(); else tuneBack();
        });

        el.volumeKnob.addEventListener('click', function (e) {
            volumeClick();
            stepVolume(clickDirection(e, el.volumeKnob));
        });
        el.volumeKnob.addEventListener('dblclick', function (e) {
            e.preventDefault();
            toggleMute();
        });

        document.addEventListener('keydown', function (e) {
            if (renamingChannel) return;   // the dial is not the keyboard's while you type
            if (e.key === 'ArrowRight') tuneForward();
            else if (e.key === 'ArrowLeft') tuneBack();
            else if (e.key === 'ArrowUp') stepVolume(1);
            else if (e.key === 'ArrowDown') stepVolume(-1);
            else if (e.key.toLowerCase() === 'm') toggleMute();
            else if (e.key.toLowerCase() === 'f') toggleFullscreen();
        });

        el.forget.addEventListener('click', function (e) {
            e.preventDefault();
            forgetViewing();
            el.forget.textContent = 'Viewing history cleared';
            setTimeout(function () {
                el.forget.textContent = 'Reset viewing history';
            }, 2600);
        });

        // Closing the tab and switching away are both "I'm done for now", and both
        // need the position written before the page stops running. visibilitychange
        // is the reliable one on mobile, where pagehide often never fires.
        window.addEventListener('pagehide', captureProgress);
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') captureProgress();
        });

        // Registered after load so it never competes with the player for the
        // connection, and wrapped because a failed registration is not a reason
        // for the television not to work.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function (err) {
                    console.warn('ThiagoTV: service worker did not register', err);
                });
            });
        }

        loadMutePreference();
        loadSeen();
        loadResume();
        loadPlaylist()
            .then(function () {
                // The player is prepared now so that switching on is instant, but
                // nothing is tuned until the viewer reaches for the switch.
                injectApi();
            })
            .catch(function (err) {
                console.error('ThiagoTV: could not load playlist.json', err);
                showCard({
                    mode: 'testcard',
                    title: 'Technical difficulties',
                    sub: 'Could not load the schedule'
                });
                el.info.textContent = 'Could not load playlist.json';
            });
    })();
    </script>
</body>
</html>
