<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThiagoTV</title>
    <meta name="description" content="A retro television set broadcasting a hand-picked playlist. Turn the dial.">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b1a33">
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ThiagoTV">
    <!-- Vercel Web Analytics: page views and referrers only. No cookies,
         so the site still needs no consent banner. -->
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* The cabinet is drawn in a deliberately small palette with hard edges and
           unblurred shadows -- the vocabulary of a sprite rather than a rendering.
           Every measurement is a multiple of the same unit so nothing lands on a
           half-pixel and softens. */
        :root {
            --px: 4px;
            --wood-lit:  #8a5a34;
            --wood:      #6b4425;
            --wood-mid:  #573517;
            --wood-dark: #3b2310;
            --wood-deep: #241408;
            --brass:     #e0b356;
            --brass-dim: #a37f31;
            --glass:     #05070a;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at 50% 34%, #16305a 0%, #101f3d 48%, #060d1c 100%);
            background-attachment: fixed;
            font-family: 'Courier New', monospace;
            /* Generous air top and bottom: the set should sit in the room with the
               background visible around it, not fill the window. */
            padding: 5vh 20px 5vh;
        }

        /* ---- The room ---------------------------------------------------------
           A wall, a window and a pair of curtains, drawn in blocks like everything
           else. Every tone here sits within a few percent of the wall behind it:
           the scene is meant to be noticed on the second look, never to compete
           with the picture. If you can read it at a glance, it's too strong. */
        .room {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        /* Wallpaper: wide, very faint vertical bands. */
        .room-wall {
            position: absolute;
            inset: 0 0 22% 0;
            background: repeating-linear-gradient(90deg,
                rgba(255, 255, 255, .012) 0 2px,
                transparent 2px 4px,
                rgba(0, 0, 0, .025) 4px 6px,
                transparent 6px 40px);
        }

        /* Floor, and the skirting board where it meets the wall. */
        .room-floor {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 22%;
            background: linear-gradient(180deg, rgba(0, 0, 0, .16) 0%, rgba(0, 0, 0, .30) 100%);
            box-shadow: inset 0 2px 0 rgba(0, 0, 0, .12);
        }
        .room-floor::before {
            content: '';
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 10px;
            background: rgba(255, 255, 255, .012);
            box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .10);
        }
        /* Floorboards, just enough to read as a surface. */
        .room-floor::after {
            content: '';
            position: absolute;
            inset: 10px 0 0 0;
            background: repeating-linear-gradient(90deg,
                rgba(255, 255, 255, .014) 0 1px, transparent 1px 64px);
        }

        /* Window: night outside, faintly lighter than the wall. */
        .room-window {
            position: absolute;
            top: 9%;
            right: 7%;
            width: 190px;
            height: 240px;
            background: linear-gradient(180deg, rgba(120, 165, 235, .055) 0%, rgba(90, 130, 200, .02) 100%);
            box-shadow:
                0 0 0 6px rgba(0, 0, 0, .10),
                0 0 0 9px rgba(0, 0, 0, .05);
        }
        /* Glazing bars: two panes across, three down. */
        .room-window::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(90deg, transparent calc(50% - 3px), rgba(0, 0, 0, .13) calc(50% - 3px) calc(50% + 3px), transparent calc(50% + 3px)),
                repeating-linear-gradient(180deg, transparent 0 78px, rgba(0, 0, 0, .13) 78px 84px);
        }
        /* A moon, small and low-contrast. */
        .room-window::after {
            content: '';
            position: absolute;
            top: 26px; left: 30px;
            width: 22px; height: 22px;
            background: rgba(210, 228, 255, .05);
        }

        .curtain {
            position: absolute;
            top: 4%;
            height: 74%;
            width: 92px;
            background: repeating-linear-gradient(90deg,
                rgba(255, 255, 255, .008) 0 6px,
                rgba(0, 0, 0, .022) 6px 14px);
            background-color: rgba(0, 0, 0, .07);
        }
        .curtain.left  { right: calc(7% + 190px + 6px); }
        .curtain.right { right: calc(7% - 92px + 6px); }

        /* Rail above the window. */
        .curtain-rail {
            position: absolute;
            top: 4%;
            right: calc(7% - 92px);
            width: calc(190px + 184px + 12px);
            height: 6px;
            background: rgba(0, 0, 0, .12);
        }

        @media (max-width: 900px) {
            /* On a narrow window the scene would crowd the set, so it steps back
               to just the wall and floor. */
            .room-window, .curtain, .curtain-rail { display: none; }
        }

        .stage {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            /* Smaller than the window on purpose. The set should read as an object
               standing in a room, which only works if there is room around it. */
            max-width: 840px;
            margin: 0 auto;
        }

        .tv-container {
            position: relative;
            width: 100%;
        }

        /* ---- Antenna ---------------------------------------------------------- */
        .tv-antenna {
            position: relative;
            height: 84px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }
        .ant-rod {
            position: absolute;
            bottom: 0;
            width: var(--px);
            height: 88px;
            background: linear-gradient(180deg, #cfd6dd 0%, #8e979f 55%, #5d666e 100%);
            transform-origin: 50% 100%;
        }
        .ant-rod.left  { transform: rotate(-34deg); }
        .ant-rod.right { transform: rotate(34deg); }
        /* Ball tips, squared off so they read as pixels rather than spheres. */
        .ant-rod::before {
            content: '';
            position: absolute;
            top: calc(var(--px) * -2);
            left: calc(var(--px) * -1.5);
            width: calc(var(--px) * 3);
            height: calc(var(--px) * 3);
            background: var(--brass);
            box-shadow: 0 0 0 var(--px) var(--wood-deep);
        }
        .ant-base {
            position: relative;
            width: calc(var(--px) * 14);
            height: calc(var(--px) * 4);
            background: var(--wood-dark);
            box-shadow:
                0 calc(var(--px) * -1) 0 var(--wood-mid),
                inset 0 var(--px) 0 rgba(255, 255, 255, .10);
        }

        /* ---- Cabinet ---------------------------------------------------------- */
        .tv-frame {
            position: relative;
            width: 100%;
            /* Vertical grain: bands rather than a smooth gradient, so the wood reads
               as a tiled texture. */
            background:
                repeating-linear-gradient(90deg,
                    rgba(0,0,0,.16) 0 2px, rgba(255,255,255,.03) 2px 6px,
                    rgba(0,0,0,.08) 6px 10px, transparent 10px 22px),
                linear-gradient(180deg, var(--wood-lit) 0%, var(--wood) 22%,
                                        var(--wood-mid) 76%, var(--wood-dark) 100%);
            padding: calc(var(--px) * 6);
            display: flex;
            flex-direction: column;
            gap: calc(var(--px) * 5);
            /* Stepped corners: the cabinet loses one block from each corner, which is
               how a rounded object looks when it has to be built out of squares. */
            clip-path: polygon(
                12px 0, calc(100% - 12px) 0, 100% 12px,
                100% calc(100% - 12px), calc(100% - 12px) 100%,
                12px 100%, 0 calc(100% - 12px), 0 12px);
            box-shadow:
                inset 0 var(--px) 0 rgba(255, 255, 255, .16),
                inset 0 calc(var(--px) * -1) 0 rgba(0, 0, 0, .55),
                inset var(--px) 0 0 rgba(255, 255, 255, .06),
                inset calc(var(--px) * -1) 0 0 rgba(0, 0, 0, .35);
        }

        /* Hard-edged drop shadow, offset in whole units. A blurred shadow would be
           the one soft thing in an otherwise crisp object. */
        .tv-container::after {
            content: '';
            position: absolute;
            left: calc(var(--px) * 2);
            right: calc(var(--px) * -2);
            top: calc(var(--px) * 2);
            bottom: calc(var(--px) * -2);
            background: rgba(0, 0, 0, .5);
            z-index: -1;
            clip-path: inherit;
        }

        /* Recessed inner panel the screen sits inside. */
        .screen-well {
            background: var(--wood-deep);
            padding: calc(var(--px) * 3);
            box-shadow:
                inset 0 var(--px) 0 rgba(0, 0, 0, .8),
                inset 0 calc(var(--px) * -1) 0 rgba(255, 255, 255, .07);
        }

        .screen-bezel {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: var(--glass);
            padding: var(--px);
            overflow: hidden;
            box-shadow:
                inset 0 0 0 var(--px) #14181d,
                inset 0 0 0 calc(var(--px) * 2) #000;
        }

        /* Corner screws, one per corner of the well. */
        .screen-well { position: relative; }
        .screen-well::before,
        .screen-well::after {
            content: '';
            position: absolute;
            top: calc(var(--px) * 1);
            width: var(--px);
            height: var(--px);
            background: var(--brass-dim);
            box-shadow: 0 0 0 1px rgba(0,0,0,.6);
        }
        .screen-well::before { left: calc(var(--px) * 1); }
        .screen-well::after  { right: calc(var(--px) * 1); }

        .screen-inner {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* Sits above the player, below every screen card, so the cards and the
           bulletin still cover it. Transparent, but it does catch the pointer --
           that is the entire job. */
        .screen-glass {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: transparent;
        }

        /* The one thing allowed to appear over the picture, and only while the
           pointer is on it. Drawn in the same blocks as the cabinet rather than
           borrowed from the player, so it reads as part of the set. */
        .fullscreen-btn {
            position: absolute;
            right: calc(var(--px) * 2);
            bottom: calc(var(--px) * 2);
            width: calc(var(--px) * 7);
            height: calc(var(--px) * 7);
            padding: 0;
            border: 0;
            cursor: pointer;
            background: rgba(5, 7, 10, .62);
            box-shadow: inset 0 0 0 1px rgba(224, 179, 86, .45);
            opacity: 0;
            transition: opacity .14s steps(2);
        }
        .screen-glass:hover .fullscreen-btn,
        .fullscreen-btn:focus-visible { opacity: 1; }
        .fullscreen-btn:hover { background: rgba(5, 7, 10, .85); }

        /* The channel's name, in the corner opposite the fullscreen button, on
           the same hover. Old sets flashed the channel over the picture for a
           second after you turned the dial; this is that, held for as long as
           you are looking. The name is the viewer's to change -- see
           channelDisplayName(). */
        .channel-tag {
            position: absolute;
            left: calc(var(--px) * 2);
            top: calc(var(--px) * 2);
            padding: calc(var(--px) * 1.2) calc(var(--px) * 2);
            font: 700 calc(var(--px) * 2.6) / 1 'Courier New', monospace;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--brass);
            background: rgba(5, 7, 10, .62);
            box-shadow: inset 0 0 0 1px rgba(224, 179, 86, .45);
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
            max-width: 60%;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: opacity .14s steps(2);
        }
        .screen-glass:hover .channel-tag { opacity: 1; }
        .channel-tag { pointer-events: auto; cursor: text; }
        .channel-tag:hover { background: rgba(5, 7, 10, .85); }
        /* While you are typing it stays put, whatever the pointer does. */
        .channel-tag[data-editing] {
            opacity: 1 !important;
            outline: none;
            background: rgba(5, 7, 10, .92);
            box-shadow: inset 0 0 0 1px var(--brass);
        }

        /* Four corner brackets: the universal sign, drawn as pixels. */
        .fullscreen-btn::before,
        .fullscreen-btn::after {
            content: '';
            position: absolute;
            width: calc(var(--px) * 2);
            height: calc(var(--px) * 2);
            border: 2px solid var(--brass);
        }
        .fullscreen-btn::before {
            top: calc(var(--px) * 1.5); left: calc(var(--px) * 1.5);
            border-right: 0; border-bottom: 0;
        }
        .fullscreen-btn::after {
            right: calc(var(--px) * 1.5); bottom: calc(var(--px) * 1.5);
            border-left: 0; border-top: 0;
        }

        /* Filling the display: the picture takes the whole screen and the
           cabinet stays behind. Scanlines come along, because they are the
           reason this looks like a television rather than a video player. */
        .screen-inner:fullscreen {
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        .screen-inner:fullscreen .fullscreen-btn::before {
            top: auto; bottom: calc(var(--px) * 1.5);
            border: 2px solid var(--brass);
            border-right: 0; border-top: 0;
        }
        .screen-inner:fullscreen .fullscreen-btn::after {
            bottom: auto; top: calc(var(--px) * 1.5);
            border: 2px solid var(--brass);
            border-left: 0; border-bottom: 0;
        }

        .scanlines::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 3;
        }

        #player, #player iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }

        /* ---- The screen card -------------------------------------------------
           Covers the player whenever there's nothing to watch: mid-tune, on an
           empty channel, or at the end of a channel's broadcast. Every variant
           is drawn in CSS/canvas rather than loaded as an image, so the whole
           site stays a couple of static files. */
        .screen-card {
            position: absolute;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: #050505;
            z-index: 2;
            overflow: hidden;
        }
        .screen-card.visible { display: flex; }

        .card-layer { position: absolute; inset: 0; display: none; }
        .screen-card[data-mode="bars"]     .layer-bars,
        .screen-card[data-mode="snow"]     .layer-snow,
        .screen-card[data-mode="testcard"] .layer-testcard { display: block; }

        /* SMPTE colour bars: seven full-height bars over a castellated strip. */
        .layer-bars {
            background:
                linear-gradient(180deg, transparent 0 74%, #0a0a0a 74% 100%),
                linear-gradient(90deg,
                    #bfbfbf 0 14.2857%, #bfbf00 14.2857% 28.5714%,
                    #00bfbf 28.5714% 42.8571%, #00bf00 42.8571% 57.1428%,
                    #bf00bf 57.1428% 71.4285%, #bf0000 71.4285% 85.7142%,
                    #0000bf 85.7142% 100%);
        }
        .layer-bars::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0; height: 26%;
            background: linear-gradient(90deg,
                #00006e 0 14.2857%, #0a0a0a 14.2857% 28.5714%,
                #bf00bf 28.5714% 42.8571%, #0a0a0a 42.8571% 57.1428%,
                #00bfbf 57.1428% 71.4285%, #0a0a0a 71.4285% 85.7142%,
                #bfbfbf 85.7142% 100%);
        }

        .layer-snow { background: #000; }
        .layer-snow canvas { width: 100%; height: 100%; display: block; }

        /* Test card: crosshair, rings and a grid, the way a station ident looked
           between programmes. */
        .layer-testcard {
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 9%),
                repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 9%),
                radial-gradient(circle at 50% 50%, #16324e 0%, #08131f 70%, #050a10 100%);
        }
        .layer-testcard::before,
        .layer-testcard::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            border: 2px solid rgba(201, 169, 97, .55);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        .layer-testcard::before { width: 58%; padding-bottom: 58%; }
        .layer-testcard::after  { width: 30%; padding-bottom: 30%; border-color: rgba(127,212,255,.45); }

        /* The message plate sits above whichever backdrop is showing. */
        .card-plate {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 14px 26px;
            background: rgba(0, 0, 0, .74);
            border: 1px solid rgba(201, 169, 97, .35);
            border-radius: 3px;
            max-width: 80%;
        }
        .card-title {
            color: #f0e2bf;
            font-size: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
            line-height: 1.5;
        }
        .card-sub {
            margin-top: 8px;
            color: #7fd4ff;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: .85;
        }
        /* A slow pulse reads as a broadcast holding pattern rather than a frozen
           page -- it tells the viewer the set is still on. */
        .screen-card.holding .card-plate { animation: holding 2.6s ease-in-out infinite; }
        @keyframes holding {
            0%, 100% { opacity: 1; }
            50%      { opacity: .55; }
        }

        @media (max-width: 768px) {
            .card-title { font-size: 12px; letter-spacing: 2px; }
            .card-sub { font-size: 9px; }
        }

        /* Sits just under the set -- close enough to read as part of the object,
           not so close that it looks stuck to the cabinet. The feet need a little
           clearance below them or the whole thing looks like it's sinking. */
        .stage-nav {
            width: 100%;
            text-align: center;
            margin-top: -6px;
            padding-bottom: 10px;
        }
        .stage-nav a {
            color: #7fd4ff;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            border-bottom: 1px solid rgba(127, 212, 255, .35);
            padding-bottom: 3px;
        }
        .stage-nav a:hover { color: #c9a961; border-bottom-color: #c9a961; }
        .stage-nav a + a { margin-left: 22px; }
        .stage-now { margin-bottom: 12px; }
        .stage-now.hidden { display: none; }

        .stage-note {
            margin-top: 8px;
            color: #6f8fb5;
            font-size: 10.5px;
            letter-spacing: 1px;
            line-height: 1.8;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }
        .stage-note a {
            font-size: 10.5px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        /* ---- Bulletin ---------------------------------------------------------
           The text channel. Styled after a station caption slide rather than a
           web page: fixed frame, generous margins, and phosphor colours, so it
           reads as something being broadcast rather than something rendered. */
        .psa-screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 7% 8%;
            background:
                linear-gradient(180deg, rgba(0,0,0,.35) 0%, transparent 30%),
                radial-gradient(ellipse at 50% 40%, #10314a 0%, #071a2a 70%, #04101a 100%);
            z-index: 2;
        }
        .psa-screen.visible { display: flex; }

        .psa-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding-bottom: 8px;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(201, 169, 97, .4);
            color: #c9a961;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            flex: none;
        }
        #psaStamp { color: #7fd4ff; letter-spacing: 1px; opacity: .8; }

        .psa-body {
            flex: 1;
            overflow-y: auto;
            color: #eaf6ff;
            font-size: 17px;
            line-height: 1.65;
            text-shadow: 0 0 8px rgba(127, 212, 255, .35);
            white-space: pre-wrap;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            .psa-body { font-size: 12px; line-height: 1.5; }
            .psa-head { font-size: 9px; letter-spacing: 1px; }
        }

        /* The title stays off the glass -- a television doesn't caption what it's
           showing, and the screen cards already say the things a viewer actually
           needs ("all caught up", "no signal"). It remains in the markup, and
           announced, because a screen reader has no other way to know what is on. */
        .video-info {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* ---- Lower deck -------------------------------------------------------
           Speaker on the left, maker's plate in the middle, controls on the right:
           the layout of a set where the tube took the whole top half. */
        .tv-deck {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: calc(var(--px) * 5);
            width: 100%;
        }

        /* Punched grille. Two offset dot grids give the staggered holes of a real
           speaker cloth without an image. */
        .speaker {
            height: calc(var(--px) * 15);
            background-color: var(--wood-deep);
            background-image:
                radial-gradient(var(--wood-mid) 1px, transparent 1.4px),
                radial-gradient(var(--wood-mid) 1px, transparent 1.4px);
            background-size: calc(var(--px) * 2) calc(var(--px) * 2);
            background-position: 0 0, var(--px) var(--px);
            box-shadow:
                inset 0 var(--px) 0 rgba(0, 0, 0, .7),
                inset 0 calc(var(--px) * -1) 0 rgba(255, 255, 255, .06);
        }

        /* The maker's name, stamped into the wood rather than printed on a plate:
           no panel behind it, and the letters take their colour from the cabinet.
           A dark edge above and a light edge below is what reads as "pressed in"
           -- the reverse would read as raised. Small on purpose; a real set wears
           its brand discreetly. */
        .brand {
            color: rgba(34, 19, 8, .9);
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            white-space: nowrap;
            text-shadow:
                0 -1px 0 rgba(0, 0, 0, .5),
                0 1px 0 rgba(222, 178, 128, .45);
        }

        .knobs {
            display: flex;
            gap: calc(var(--px) * 5);
        }

        /* ---- Power ------------------------------------------------------------
           The set starts off. That isn't only styling: a browser will not let a
           video begin with sound until the viewer has interacted with the page,
           so the switch doubles as the gesture that earns the audio. Everything
           after it can play out loud. */
        .power {
            width: calc(var(--px) * 11);
            height: calc(var(--px) * 11);
            padding: 0;
            border: 0;
            cursor: pointer;
            background: linear-gradient(180deg, #59616a 0%, #33383f 42%, #171b1f 100%);
            clip-path: polygon(
                33% 0, 67% 0, 100% 33%, 100% 67%,
                67% 100%, 33% 100%, 0 67%, 0 33%);
            position: relative;
            box-shadow:
                inset 0 var(--px) 0 rgba(255, 255, 255, .14),
                inset 0 calc(var(--px) * -1) 0 rgba(0, 0, 0, .7),
                0 var(--px) 0 rgba(0, 0, 0, .55),
                0 calc(var(--px) * 2) 0 rgba(0, 0, 0, .32),
                0 calc(var(--px) * 3) 0 rgba(0, 0, 0, .16);
            transform: translateY(0);
            transition: transform .1s steps(2), box-shadow .1s steps(2), filter .12s steps(2);
        }
        .power:hover { filter: brightness(1.22); }

        /* Switched on, the button stays pushed in -- the state is the position,
           which is why it needs no label under it. */
        .power:active,
        .power.on {
            transform: translateY(calc(var(--px) * 1.5));
            box-shadow:
                inset 0 var(--px) 0 rgba(255, 255, 255, .08),
                inset 0 calc(var(--px) * -1) 0 rgba(0, 0, 0, .7),
                0 calc(var(--px) * .5) 0 rgba(0, 0, 0, .5);
        }

        /* The lamp: dead when off, lit when on. */
        .power::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: calc(var(--px) * 2);
            height: calc(var(--px) * 2);
            margin: calc(var(--px) * -1) 0 0 calc(var(--px) * -1);
            background: #3a1010;
            transition: background .18s steps(2), box-shadow .18s steps(2);
        }
        .power.on::after {
            background: #ff5a4a;
            box-shadow: 0 0 calc(var(--px) * 3) #ff5a4a;
        }

        /* ---- Screen off / switch-on ------------------------------------------- */
        .screen-off {
            position: absolute;
            inset: 0;
            z-index: 4;
            background:
                linear-gradient(145deg, rgba(255,255,255,.045) 0%, transparent 42%),
                #05070a;
        }
        .screen-off.hidden { display: none; }

        /* A tube coming to life: a bright line snaps across the middle, opens out
           to fill the screen, then fades off the picture. Steps rather than smooth
           easing, to match everything else about this set. */
        .crt {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            display: none;
            background: #fff;
        }
        .crt.firing {
            display: block;
            animation: crt-on 620ms steps(1, end) forwards;
        }
        @keyframes crt-on {
            0%   { transform: scale(1, 0.004); opacity: 1; filter: brightness(2); }
            22%  { transform: scale(1, 0.004); opacity: 1; }
            45%  { transform: scale(1, 0.05);  opacity: 1; }
            65%  { transform: scale(1, 1);     opacity: .85; }
            100% { transform: scale(1, 1);     opacity: 0; }
        }

        /* Switching off collapses the picture back down to a dot. */
        .crt.collapsing {
            display: block;
            animation: crt-off 420ms steps(1, end) forwards;
        }
        @keyframes crt-off {
            0%   { transform: scale(1, 1);        opacity: .5; }
            40%  { transform: scale(1, 0.02);     opacity: 1; }
            75%  { transform: scale(0.06, 0.02);  opacity: 1; }
            100% { transform: scale(0, 0);        opacity: 0; }
        }

        .knob-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(var(--px) * 1);
        }

        /* Square-ish knob with the corners knocked off -- a circle as a sprite
           would draw one. The stepped clip does the rounding. */
        /* The controls stand proud of the cabinet. Depth comes from stacked hard
           shadows rather than a blur: a lit top edge, a dark underside, and a
           slab of shadow cast onto the wood below. Pressing one sinks it into
           its own shadow, which is the whole illusion. */
        .knob {
            width: calc(var(--px) * 11);
            height: calc(var(--px) * 11);
            background:
                linear-gradient(180deg, #59616a 0%, #33383f 42%, #171b1f 100%);
            clip-path: polygon(
                33% 0, 67% 0, 100% 33%, 100% 67%,
                67% 100%, 33% 100%, 0 67%, 0 33%);
            position: relative;
            cursor: pointer;
            box-shadow:
                inset 0 var(--px) 0 rgba(255, 255, 255, .14),
                inset 0 calc(var(--px) * -1) 0 rgba(0, 0, 0, .7),
                0 var(--px) 0 rgba(0, 0, 0, .55),
                0 calc(var(--px) * 2) 0 rgba(0, 0, 0, .32),
                0 calc(var(--px) * 3) 0 rgba(0, 0, 0, .16);
            transform: translateY(0);
            transition: transform .1s steps(2), box-shadow .1s steps(2), filter .12s steps(2);
        }
        .knob:hover { filter: brightness(1.22); }
        .knob:active {
            filter: brightness(.85);
            transform: translateY(calc(var(--px) * 1.5));
            box-shadow:
                inset 0 var(--px) 0 rgba(255, 255, 255, .08),
                inset 0 calc(var(--px) * -1) 0 rgba(0, 0, 0, .7),
                0 calc(var(--px) * .5) 0 rgba(0, 0, 0, .5);
        }

        /* Pointer, rotated in fixed steps so it clicks between positions rather
           than gliding. */
        .knob::before {
            content: '';
            position: absolute;
            top: var(--px);
            left: 50%;
            width: var(--px);
            height: calc(var(--px) * 3);
            background: var(--brass);
            transform-origin: 50% calc(var(--px) * 4.5);
            transform: translateX(-50%) rotate(var(--knob-angle, 0deg));
            transition: transform .32s cubic-bezier(.34, .8, .3, 1);
        }

        /* Hub cap. */
        .knob::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: calc(var(--px) * 2);
            height: calc(var(--px) * 2);
            margin: calc(var(--px) * -1) 0 0 calc(var(--px) * -1);
            background: #0b0d10;
        }

        .knob-label {
            font-size: 9px;
            color: #d8c9a8;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* The controls report their state by where they point, the way a real set
           does, so none of these are shown. They stay in the markup and keep
           announcing, because a knob's angle means nothing to a screen reader. */
        .knob-value {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* The channel's name is kept out of the picture -- turning the dial and
           finding out what's on is the point. It stays in the markup for screen
           readers, which have no other way to know the set just changed channel. */
        .knob-value.unlabelled {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* ---- Feet ------------------------------------------------------------- */
        .tv-feet {
            display: flex;
            justify-content: space-between;
            padding: 0 calc(var(--px) * 9);
        }
        .tv-feet span {
            width: calc(var(--px) * 9);
            height: calc(var(--px) * 3);
            background: var(--wood-deep);
            box-shadow: inset 0 var(--px) 0 var(--wood-dark);
            clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 6px 100%);
        }

        /* ---- Portrait on a phone ---------------------------------------------
           The cabinet is mostly furniture, and on a narrow screen furniture is
           what eats the picture. Everything decorative shrinks so the tube keeps
           the width it needs. */
        @media (max-width: 768px) {
            :root { --px: 3px; }
            body { padding: 3vh 8px 3vh; }
            .stage { max-width: 100%; gap: 10px; }
            .tv-frame { padding: calc(var(--px) * 3); gap: calc(var(--px) * 3); }
            .screen-well { padding: calc(var(--px) * 2); }
            .tv-antenna { height: 42px; }
            .ant-rod { height: 46px; }
            .tv-deck { grid-template-columns: 1fr auto; row-gap: calc(var(--px) * 2); }
            .brand { grid-column: 1 / -1; text-align: center; font-size: 10px; letter-spacing: 3px; }
            .speaker { height: calc(var(--px) * 8); }
            .knobs { gap: calc(var(--px) * 4); }
            .stage-nav { font-size: 10px; }
            .stage-nav a { font-size: 10px; letter-spacing: 1px; }
            .stage-nav a + a { margin-left: 12px; }
        }

        /* ---- Landscape on a phone --------------------------------------------
           Here height is the scarce thing, not width. A 16:9 screen inside a
           cabinet inside a page will not fit a 400px-tall viewport, so the set
           is sized from the height available and everything that isn't the
           picture or a control is dropped: antenna, feet, speaker grille and the
           maker's plate are all decoration, and decoration is what has to go
           when there is no room. */
        @media (orientation: landscape) and (max-height: 560px) {
            :root { --px: 3px; }
            body { padding: 6px 10px; }
            .stage {
                /* Widest the set can be while its screen still fits the viewport:
                   16/9 for the tube, less the cabinet's own vertical share. */
                max-width: min(100%, calc(100vh * 1.42));
                gap: 6px;
            }
            .tv-antenna, .tv-feet, .speaker { display: none; }
            .tv-frame { padding: calc(var(--px) * 2); gap: calc(var(--px) * 2); }
            .screen-well { padding: var(--px); }
            .tv-deck {
                grid-template-columns: 1fr auto;
                align-items: center;
                gap: calc(var(--px) * 3);
            }
            .brand { grid-column: auto; font-size: 9px; letter-spacing: 2px; }
            .knob, .power { width: calc(var(--px) * 8); height: calc(var(--px) * 8); }
            .knob-label { font-size: 7px; letter-spacing: 1px; }
            .stage-nav { margin-top: 0; padding-bottom: 0; }
            .stage-now { margin-bottom: 4px; }
        }
    </style>
</head>
<body>
  <div class="room" aria-hidden="true">
    <div class="room-wall"></div>
    <div class="curtain-rail"></div>
    <div class="room-window"></div>
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <div class="room-floor"></div>
  </div>

  <div class="stage">
    <div class="tv-container">
        <div class="tv-antenna" aria-hidden="true">
            <span class="ant-rod left"></span>
            <span class="ant-rod right"></span>
            <span class="ant-base"></span>
        </div>

        <div class="tv-frame">
          <div class="screen-well">
            <div class="screen-bezel">
                <div class="screen-inner scanlines">
                    <div id="player"></div>
                    <!-- A pane of glass over the tube. The player's chrome lives
                         inside a cross-origin iframe and cannot be restyled, but it
                         only appears on hover — so the fix is to make sure the
                         pointer never reaches it. The set has its own controls; a
                         second, borrowed set of them floating over the picture was
                         always the wrong object in the room. Seeking and the full
                         player remain one click away on the programme page. -->
                    <div class="screen-glass" id="screenGlass">
                        <div class="channel-tag" id="channelTag"
                             title="Double-click to rename this channel"></div>
                        <button class="fullscreen-btn" id="fullscreenBtn"
                                aria-label="Fullscreen"></button>
                    </div>
                    <div class="screen-card" id="screenCard" data-mode="snow">
                        <div class="card-layer layer-bars"></div>
                        <div class="card-layer layer-snow"><canvas id="snowCanvas"></canvas></div>
                        <div class="card-layer layer-testcard"></div>
                        <div class="card-plate">
                            <div class="card-title" id="cardTitle">Please stand by</div>
                            <div class="card-sub" id="cardSub"></div>
                        </div>
                    </div>
                    <div class="psa-screen" id="psaScreen">
                        <div class="psa-head">
                            <span>ThiagoTV Bulletin</span>
                            <span id="psaStamp"></span>
                        </div>
                        <p class="psa-body" id="psaBody"></p>
                    </div>
                    <div class="screen-off" id="screenOff"></div>
                    <div class="crt" id="crt"></div>
                    <div class="video-info" id="videoInfo" aria-live="polite">Warming up the tubes…</div>
                </div>
            </div>
          </div>

            <div class="tv-deck">
                <div class="speaker" aria-hidden="true"></div>

                <div class="brand">ThiagoTV</div>

                <div class="knobs">
                    <div class="knob-group">
                        <button class="power" id="powerBtn" aria-pressed="false" aria-label="Power"></button>
                        <div class="knob-label">Power</div>
                        <div class="knob-value" id="powerValue" aria-live="polite">Off</div>
                    </div>

                    <div class="knob-group">
                        <div class="knob" id="volumeKnob"></div>
                        <div class="knob-label">Vol</div>
                        <div class="knob-value" id="volumeValue" aria-live="polite">Medium</div>
                    </div>

                    <div class="knob-group">
                        <div class="knob" id="channelKnob"></div>
                        <div class="knob-label">Chan</div>
                        <div class="knob-value unlabelled" id="channelValue" aria-live="polite">Latest</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="tv-feet" aria-hidden="true"><span></span><span></span></div>
    </div>


    <!-- A real anchor, not a scripted one: this is how a crawler finds its way
         from the front page into the generated programme pages. -->
    <nav class="stage-nav">
      <!-- Points at whatever is on screen, on its own line above the rest.
           Hidden until there is something to point at, so it never offers a
           dead link while the set is off. -->
      <p class="stage-now hidden">
        <a href="#" id="nowLink">About this programme</a>
      </p>
      <a href="guide.html">Programme guide</a>
      <p class="stage-note"><a href="#" id="forgetLink">Reset viewing history</a></p>
    </nav>
  </div>

    <script>
    (function () {
        'use strict';

        // ---- Channel definitions -------------------------------------------------
        // A channel is a filter plus an ordering, and one more thing: whether it will
        // show a viewer something they've already seen.
        //
        // `repeat: false` makes a channel strictly about what's new to *you*. When
        // you've seen everything it carries, it has nothing to say and goes to static
        // rather than pretending. Latest is that channel -- its whole promise is
        // newness, and quietly re-running old videos would break it.
        //
        // Every other channel repeats once you're through the unseen ones, because
        // their promise is a genre, not a novelty, and a music channel that refuses
        // to play anything twice is just a channel that switches itself off.
        var CHANNELS = [
            { id: 'latest',   label: 'Latest',   tag: null,        order: 'newest', repeat: false },
            // The one channel that carries no video: a text bulletin that expires
            // on its own. See renderPsa().
            { id: 'music',    label: 'Music',    tag: 'music',     order: 'shuffle' },
            // Long-form. `resume: true` makes the channel pick a film up where the
            // viewer left it -- see the resume block below for why that runs out.
            { id: 'films',    label: 'Films',    tag: 'films',     order: 'shuffle', resume: true },
            // Also long-form, so it picks up where the viewer left off.
            { id: 'history',  label: 'History',  tag: 'history',   order: 'shuffle', resume: true },
            // Long-form futurism and space essays, so it picks up where you left off.
            { id: 'science',  label: 'Science',  tag: 'science',   order: 'shuffle', resume: true },
            { id: 'nature',   label: 'Nature',   tag: 'nature',    order: 'shuffle' },
            { id: 'cartoon',  label: 'Cartoon',  tag: 'cartoon',   order: 'shuffle', resume: true },
            { id: 'ads',      label: 'Infomercials', tag: 'ads',   order: 'shuffle', resume: true },
            { id: 'drag',     label: 'Drag',     tag: 'drag',      order: 'shuffle' },
            { id: 'comedy',   label: 'Comedy',   tag: 'comedy',    order: 'shuffle' },
            { id: 'vignette', label: 'Vignette', tag: 'vignette',  order: 'shuffle' },
            // Last on the dial. It is a notice board, not a channel you should
            // trip over on your way from Latest to anything else.
            { id: 'psa',      label: 'Bulletin', kind: 'text' }
        ];

        var library = [];        // everything from playlist.json
        var psa = null;          // the current bulletin, if any

        // ---- Channel names -------------------------------------------------------
        // The station names its channels in CHANNELS above. A viewer can rename any
        // of them for themselves -- their set, their dial -- and the new name is
        // what shows on the dial readout and in the corner of the picture. Kept in
        // their own browser and sent nowhere, like the viewing memory below.
        //
        // An empty or whitespace-only override is no override: the station's name
        // comes back rather than leaving a blank channel.
        var CHNAMES_KEY = 'thiagotv.channelNames.v1';
        var channelNames = Object.create(null);
        var renamingChannel = false;   // true while the corner label is being typed in

        function loadChannelNames() {
            try {
                var raw = localStorage.getItem(CHNAMES_KEY);
                if (raw) channelNames = JSON.parse(raw) || Object.create(null);
            } catch (e) { channelNames = Object.create(null); }
        }

        function channelDisplayName(ch) {
            if (!ch) return '';
            var custom = channelNames[ch.id];
            if (typeof custom === 'string' && custom.trim()) return custom.trim();
            return ch.label;
        }

        function renameChannel(id, name) {
            // Capped: the label sits over the picture, and a sentence is not a
            // channel name.
            if (typeof name === 'string' && name.trim()) channelNames[id] = name.trim().slice(0, 28);
            else delete channelNames[id];        // back to the station's own name
            try { localStorage.setItem(CHNAMES_KEY, JSON.stringify(channelNames)); } catch (e) {}
            showChannelName(CHANNELS[channelIndex]);
        }

        // Both places the channel's name appears, written together so they can
        // never disagree.
        function showChannelName(ch) {
            var name = channelDisplayName(ch);
            el.channelValue.textContent = name;
            if (el.channelTag) el.channelTag.textContent = name;
        }

        loadChannelNames();

        // ---- Viewing memory ------------------------------------------------------
        // What this viewer has already watched, kept in their own browser and sent
        // nowhere. It exists so a returning visitor gets shown something new rather
        // than the same video that greeted them last time.
        //
        // Entries expire: a station that never repeats anything is a station that
        // eventually has nothing to show, and after a few months a video is worth
        // seeing again anyway.
        var SEEN_KEY = 'thiagotv.seen.v1';
        var SEEN_TTL_DAYS = 90;

        var seen = Object.create(null);   // videoId -> epoch ms, last watched
        var seenAtLoad = Object.create(null); // snapshot, so "repeat" stays stable

        function storage() {
            // Private browsing and blocked-storage settings both throw here rather
            // than returning null, and a TV that won't switch on because it can't
            // take notes is a bad trade. Losing the memory is the acceptable failure.
            try {
                var probe = '__tv__';
                window.localStorage.setItem(probe, probe);
                window.localStorage.removeItem(probe);
                return window.localStorage;
            } catch (e) {
                return null;
            }
        }

        function loadSeen() {
            var store = storage();
            if (!store) return;
            try {
                var raw = JSON.parse(store.getItem(SEEN_KEY) || '{}');
                var cutoff = Date.now() - SEEN_TTL_DAYS * 86400000;
                Object.keys(raw).forEach(function (id) {
                    if (typeof raw[id] === 'number' && raw[id] > cutoff) seen[id] = raw[id];
                });
            } catch (e) {
                console.warn('ThiagoTV: could not read viewing memory', e);
            }
            Object.keys(seen).forEach(function (id) { seenAtLoad[id] = seen[id]; });
        }

        // Merge rather than overwrite. Two tabs of the set share one localStorage but
        // not one copy of `seen`, so a plain write means whichever tab saves last
        // erases whatever the other one watched. Reading first and keeping the later
        // timestamp for each video makes concurrent tabs additive instead.
        function saveSeen() {
            var store = storage();
            if (!store) return;
            try {
                var merged = {};
                try {
                    var existing = JSON.parse(store.getItem(SEEN_KEY) || '{}');
                    Object.keys(existing).forEach(function (id) {
                        if (typeof existing[id] === 'number') merged[id] = existing[id];
                    });
                } catch (e) { /* unreadable: this write replaces it */ }

                Object.keys(seen).forEach(function (id) {
                    if (!merged[id] || seen[id] > merged[id]) merged[id] = seen[id];
                });

                store.setItem(SEEN_KEY, JSON.stringify(merged));
            } catch (e) {
                // Quota, most likely. Not worth interrupting playback over.
                console.warn('ThiagoTV: could not save viewing memory', e);
            }
        }

        function markSeen(videoId) {
            if (!videoId) return;
            seen[videoId] = Date.now();
            saveSeen();
        }

        // Two different questions, deliberately answered by two different records.
        //
        // wasSeen drives ordering and must be live: a video watched a minute ago
        // should sort behind one that hasn't been.
        //
        // isRepeat drives the on-screen label and must NOT be live, or a video
        // would relabel itself as a repeat while the viewer is still watching it
        // for the first time.
        function wasSeen(videoId) {
            return Object.prototype.hasOwnProperty.call(seen, videoId);
        }

        function isRepeat(videoId) {
            return Object.prototype.hasOwnProperty.call(seenAtLoad, videoId);
        }

        // Three positions rather than a continuous dial, because a knob that
        // snaps between off, half and full is what a set of this age would have
        // had -- and because there is no room on screen for a slider that reads
        // as anything but a modern control.
        var MUTE_KEY = 'thiagotv.muted.v1';
        var VOLUME_STEPS = [
            { label: 'Muted',  volume: 0,   angle: -104 },
            { label: 'Medium', volume: 45,  angle: 0 },
            { label: 'Loud',   volume: 100, angle: 104 }
        ];
        var volumeStep = 1;   // middle by default: audible without being a shock

        function loadMutePreference() {
            var store = storage();
            if (!store) return;
            try {
                var saved = store.getItem(MUTE_KEY);
                if (saved === null) return;
                // Earlier versions stored a two-state preference. Carry it across
                // rather than silently resetting someone's setting.
                if (saved === 'muted') volumeStep = 0;
                else if (saved === 'sound') volumeStep = 1;
                else {
                    var n = parseInt(saved, 10);
                    if (n >= 0 && n < VOLUME_STEPS.length) volumeStep = n;
                }
            } catch (e) {}
        }

        function rememberMutePreference() {
            var store = storage();
            if (!store) return;
            try { store.setItem(MUTE_KEY, String(volumeStep)); } catch (e) {}
        }

        // ---- Resume points -------------------------------------------------------
        // Where the viewer got to in a long film. Dropping someone back at 00:00 of a
        // ninety-minute picture is the one place the "just keep broadcasting" model
        // falls down, so channels marked `resume: true` remember the position.
        //
        // It runs out deliberately. Someone who has dipped into the same film six
        // times and never finished it isn't going to; past that the film stops being
        // offered as unfinished business and is treated as watched, so the channel
        // moves on to something else. Without a cap, one abandoned film would greet
        // that viewer forever.


        var RESUME_KEY = 'thiagotv.resume.v1';
        // Going forward, a video gets exactly one second chance: come back to it
        // once and it picks up where you left it, come back again and the channel
        // moves on. Going *backwards* through the dial ignores this entirely --
        // see tuneBack(), where returning is a return, not a re-encounter.
        var MAX_RESUMES = 1;
        var forceResume = false;
        var RESUME_MIN_SECONDS = 5;    // below this there is nothing worth returning to
        var RESUME_END_MARGIN = 90;    // this close to the end counts as finished
        var PROGRESS_MS = 5000;

        var resumePoints = Object.create(null);  // videoId -> { t: seconds, n: resumes }
        var progressTimer = null;

        function loadResume() {
            var store = storage();
            if (!store) return;
            try {
                var raw = JSON.parse(store.getItem(RESUME_KEY) || '{}');
                Object.keys(raw).forEach(function (id) {
                    var r = raw[id];
                    if (r && typeof r.t === 'number' && typeof r.n === 'number') {
                        resumePoints[id] = { t: r.t, n: r.n };
                    }
                });
            } catch (e) {
                console.warn('ThiagoTV: could not read resume points', e);
            }
        }

        // Merged for the same reason as the watch history: two tabs share storage but
        // not memory, and a plain write loses whatever the other tab was watching.
        function saveResume() {
            var store = storage();
            if (!store) return;
            try {
                var merged = {};
                try {
                    var existing = JSON.parse(store.getItem(RESUME_KEY) || '{}');
                    Object.keys(existing).forEach(function (id) {
                        var r = existing[id];
                        if (r && typeof r.t === 'number') merged[id] = { t: r.t, n: r.n || 0 };
                    });
                } catch (e) { /* unreadable: this write replaces it */ }

                Object.keys(resumePoints).forEach(function (id) {
                    var mine = resumePoints[id];
                    var theirs = merged[id];
                    merged[id] = {
                        // Furthest position and highest count both win: whichever tab
                        // got further has the more useful answer.
                        t: theirs ? Math.max(mine.t, theirs.t) : mine.t,
                        n: theirs ? Math.max(mine.n, theirs.n || 0) : mine.n
                    };
                });

                store.setItem(RESUME_KEY, JSON.stringify(merged));
            } catch (e) {
                console.warn('ThiagoTV: could not save resume points', e);
            }
        }

        // Forget the whole record. Only correct when a video was actually watched
        // to the end -- there's nothing to return to, and it has earned a clean
        // slate if it ever comes round again.
        function clearResume(videoId) {
            delete resumePoints[videoId];
            var store = storage();
            if (!store) return;
            try {
                var raw = JSON.parse(store.getItem(RESUME_KEY) || '{}');
                delete raw[videoId];
                store.setItem(RESUME_KEY, JSON.stringify(raw));
            } catch (e) { /* nothing worth doing about it */ }
        }

        // Forget where they got to, but remember how many attempts they've spent.
        // Used when someone bails out in the first half-minute: there's no useful
        // position to keep, but wiping the count too would hand a film they keep
        // abandoning another six chances, and it would never retire.
        function forgetPosition(videoId) {
            var existing = resumePoints[videoId];
            if (!existing) return;
            resumePoints[videoId] = { t: 0, n: existing.n };
            saveResume();
        }

        function stopProgressTracking() {
            if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
        }

        // Take a reading right now. The interval alone would lose up to five seconds
        // of a film whenever someone turns the dial or shuts the tab -- exactly the
        // two moments a resume point matters most.
        function captureProgress() {
            if (!current || !current.queue.length) return;
            if (!player || !playerReady || !expectingPlayback) return;
            var video = current.queue[current.index];
            var t, d;
            try {
                t = player.getCurrentTime();
                d = player.getDuration();
            } catch (e) { return; }
            if (!t || !d) return;

            if (d - t <= RESUME_END_MARGIN) {
                clearResume(video.videoId);   // effectively finished
                return;
            }
            if (t <= RESUME_MIN_SECONDS) {
                forgetPosition(video.videoId); // too early to be worth returning to
                return;
            }
            var existing = resumePoints[video.videoId];
            resumePoints[video.videoId] = { t: t, n: existing ? existing.n : 0 };
            saveResume();
        }

        function startProgressTracking(videoId) {
            stopProgressTracking();
            progressTimer = setInterval(function () {
                if (!player || !playerReady || !expectingPlayback) return;
                var t, d;
                try {
                    t = player.getCurrentTime();
                    d = player.getDuration();
                } catch (e) { return; }
                if (!t || !d) return;

                // Near the end is finished, not a place to come back to.
                if (d - t <= RESUME_END_MARGIN) {
                    clearResume(videoId);
                    return;
                }
                if (t <= RESUME_MIN_SECONDS) {
                    forgetPosition(videoId);
                    return;
                }
                var existing = resumePoints[videoId];
                resumePoints[videoId] = { t: t, n: existing ? existing.n : 0 };
                saveResume();
            }, PROGRESS_MS);
        }

        function formatClock(seconds) {
            var s = Math.max(0, Math.floor(seconds));
            var h = Math.floor(s / 3600);
            var m = Math.floor((s % 3600) / 60);
            var sec = s % 60;
            var pad = function (n) { return (n < 10 ? '0' : '') + n; };
            return h > 0 ? h + ':' + pad(m) + ':' + pad(sec) : m + ':' + pad(sec);
        }

        function forgetViewing() {
            seen = Object.create(null);
            seenAtLoad = Object.create(null);
            resumePoints = Object.create(null);
            stopProgressTracking();
            var store = storage();
            if (store) {
                try {
                    store.removeItem(SEEN_KEY);
                    store.removeItem(RESUME_KEY);
                } catch (e) {}
            }
            channels = Object.create(null);   // rebuild every running order
            current = null;
            tuneTo(channelIndex);
        }

        // Each channel keeps its own running order and its own cursor, and holds on
        // to them for the whole session. That's what makes the dial feel like a real
        // set: a channel is a thing that exists whether or not you're watching it,
        // not a list that restarts every time you look. See tuneTo() for the part
        // that makes it feel *live*.
        var channels = Object.create(null);   // id -> { queue: [], index: 0 }
        var current = null;                   // the channel state we're watching
        var channelIndex = 0;

        var player = null;
        var playerReady = false;
        var muted = true;        // start muted so autoplay is never blocked
        var pendingVideo = null; // set before the player exists
        var pendingStartAt = 0;  // resume position for that pending video

        // True only while a video is meant to be on screen. The player keeps
        // emitting state changes after we stop it -- stopVideo() alone reports CUED,
        // which looks identical to "a video just loaded fine". Without this flag
        // those stray events hide the bulletin or the off-air card and restart
        // playback underneath them.
        var expectingPlayback = false;

        // How many times in a row we'll nudge a stalled player back into playing
        // before accepting that something else is going on.
        var MAX_STALLS = 4;
        var stalls = 0;

        // Videos that would not play in this session. Availability is not a property
        // we can check once at add-time: a video can be pulled, go private, or become
        // embed-restricted long after it lands in the playlist. So the player treats
        // every failure as "this channel just doesn't carry that one" and rolls on.
        var deadVideos = Object.create(null);

        // How we decide a video is dead. Error codes turn out to be untrustworthy —
        // YouTube fires 153 (a referrer/origin check) on perfectly healthy videos, so
        // acting on the error alone would blank out the whole playlist. What actually
        // separates a good video from a dead one is simple: a good one starts
        // playing. So every load arms a watchdog, and reaching PLAYING disarms it.
        // An error doesn't condemn the video, it just shortens its grace period.
        var WATCHDOG_MS = 9000;       // no error seen; allow for slow buffering
        var WATCHDOG_AFTER_ERROR_MS = 2500;
        var watchdog = null;
        var watchdogVideoId = null;

        function armWatchdog(videoId, delay) {
            clearTimeout(watchdog);
            watchdogVideoId = videoId;
            watchdog = setTimeout(function () {
                if (watchdogVideoId === videoId) markDeadAndSkip(videoId);
            }, delay);
        }

        function disarmWatchdog() {
            clearTimeout(watchdog);
            watchdog = null;
            watchdogVideoId = null;
        }

        var el = {
            info: document.getElementById('videoInfo'),
            card: document.getElementById('screenCard'),
            cardTitle: document.getElementById('cardTitle'),
            cardSub: document.getElementById('cardSub'),
            snow: document.getElementById('snowCanvas'),
            psa: document.getElementById('psaScreen'),
            psaBody: document.getElementById('psaBody'),
            psaStamp: document.getElementById('psaStamp'),
            forget: document.getElementById('forgetLink'),
            fullscreen: document.getElementById('fullscreenBtn'),
            channelTag: document.getElementById('channelTag'),
            screenInner: document.querySelector('.screen-inner'),
            nowLink: document.getElementById('nowLink'),
            nowRow: document.querySelector('.stage-now'),
            power: document.getElementById('powerBtn'),
            powerValue: document.getElementById('powerValue'),
            screenOff: document.getElementById('screenOff'),
            crt: document.getElementById('crt'),
            channelValue: document.getElementById('channelValue'),
            channelKnob: document.getElementById('channelKnob'),
            volumeValue: document.getElementById('volumeValue'),
            volumeKnob: document.getElementById('volumeKnob')
        };

        // ---- Playlist loading ----------------------------------------------------
        function loadPlaylist() {
            return fetch('playlist.json', { cache: 'no-store' })
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) {
                    library = (data.playlist || []).filter(function (v) {
                        return v && typeof v.videoId === 'string' && v.videoId.length > 0;
                    });
                    psa = data.psa || null;
                });
        }

        function shuffle(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
            }
            return arr;
        }

        // Built once per channel per session and then left alone. Reshuffling on every
        // visit would throw away the cursor and let you land on something you just
        // watched -- the exact thing the dial is supposed to avoid.
        function stateFor(ch) {
            if (channels[ch.id]) return channels[ch.id];

            // A text channel has no running order to keep -- it shows whatever is
            // currently posted, or nothing.
            if (ch.kind === 'text') {
                channels[ch.id] = { kind: 'text', queue: [], index: 0, seen: 0, offAir: false };
                return channels[ch.id];
            }

            var items = library.filter(function (v) {
                if (deadVideos[v.videoId]) return false;
                if (!ch.tag) return true;
                return Array.isArray(v.tags) && v.tags.indexOf(ch.tag) !== -1;
            });

            // Split on what this viewer has already watched, order each half by the
            // channel's own rule, then put the unseen half first, so the freshest
            // thing you haven't seen always leads.
            var fresh = [];
            var repeats = [];
            items.forEach(function (v) {
                (wasSeen(v.videoId) ? repeats : fresh).push(v);
            });

            if (ch.order === 'newest') {
                var byDate = function (a, b) {
                    return String(b.addedAt || '').localeCompare(String(a.addedAt || ''));
                };
                fresh.sort(byDate);
                repeats.sort(byDate);
            } else {
                shuffle(fresh);
                shuffle(repeats);
            }

            var allowRepeats = ch.repeat !== false;
            var running = allowRepeats ? fresh.concat(repeats) : fresh;

            // Latest leads with the newest thing this viewer has *not* seen.
            // An earlier version forced the newest video to the front whether or
            // not it had been watched, which made "skip what I've already seen"
            // impossible to honour on the one channel where it matters most.
            // Newest-first ordering already lives in `fresh`, so there is nothing
            // more to do here: posting or bumping still puts a video at the head
            // of the queue for everyone who hasn't watched it.

            channels[ch.id] = {
                queue: running,
                index: 0,
                seen: 0,
                offAir: false,
                allowRepeats: allowRepeats,
                resume: ch.resume === true,
                // Distinguishes "this channel carries nothing" from "you've watched
                // everything it carries" -- the viewer deserves a different sentence
                // for each.
                caughtUp: !allowRepeats && fresh.length === 0 && repeats.length > 0
            };
            return channels[ch.id];
        }

        // Coming back to a channel that finished its run starts a fresh broadcast:
        // new shuffle, cursor back to the top. This is also what stops a long visit
        // from looping the same fixed order forever.
        function signBackOn(ch, state) {
            // Rebuild rather than just reshuffle: anything watched during this
            // session should now sort to the back like any other repeat, and a
            // non-repeating channel needs to re-check whether anything is still
            // unseen before it claims to have programming.
            delete channels[ch.id];
            var rebuilt = stateFor(ch);
            state.queue = rebuilt.queue;
            state.allowRepeats = rebuilt.allowRepeats;
            state.caughtUp = rebuilt.caughtUp;
            channels[ch.id] = state;
            state.index = 0;
            state.seen = 0;
            state.offAir = rebuilt.caughtUp;
        }

        // ---- The screen card -----------------------------------------------------
        // Dead air is a real part of watching television, so the empty states get the
        // same care as the programming. Which backdrop appears is random, because a
        // station that always failed the same way would stop feeling like a station.
        var CARD_MODES = ['bars', 'snow', 'testcard'];

        // Sign-off lines, drawn at random. Kept short so they read at a glance on the
        // small screen, and worded like a caption a station would actually run.
        var SIGN_OFF = [
            'We now conclude our broadcast day',
            'That concludes our programming',
            'This channel has gone off air',
            'End of transmission'
        ];
        var TROUBLE = [
            'Technical difficulties',
            'Please stand by',
            'Do not adjust your set',
            'Normal service will resume shortly'
        ];

        // Running out of *new* things is not a fault and shouldn't borrow the
        // language of one. It's the station telling you you're up to date.
        var CAUGHT_UP = [
            'You have seen everything new',
            'Nothing new since your last visit',
            'You are up to date'
        ];

        function pick(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        // How often turning the dial puts on a show about it, and for how long.
        // Roughly one tune in six: often enough to be a character trait, rare
        // enough that it never feels like an obstacle between you and the video.
        var INTERSTITIAL_CHANCE = 0.17;
        var INTERSTITIAL_MS = 1500;
        var hasTuned = false;

        function showCard(opts) {
            stopSnow();
            var mode = opts.mode || pick(CARD_MODES);
            el.card.setAttribute('data-mode', mode);
            el.card.classList.add('visible');
            el.card.classList.toggle('holding', opts.holding !== false);
            el.cardTitle.textContent = opts.title;
            el.cardSub.textContent = opts.sub || '';
            if (mode === 'snow') startSnow();
        }

        function hideCard() {
            stopSnow();
            el.card.classList.remove('visible');
        }

        // ---- Snow ----------------------------------------------------------------
        // Drawn on a canvas at a deliberately low frame rate and a low resolution:
        // analogue snow was coarse and flickery, and rendering it at full detail
        // would look wrong as well as cost more than dead air deserves.
        var snowTimer = null;
        var SNOW_W = 160, SNOW_H = 96, SNOW_FPS = 12;

        function startSnow() {
            var canvas = el.snow;
            canvas.width = SNOW_W;
            canvas.height = SNOW_H;
            var ctx = canvas.getContext('2d');
            var image = ctx.createImageData(SNOW_W, SNOW_H);

            function frame() {
                var data = image.data;
                for (var i = 0; i < data.length; i += 4) {
                    var v = (Math.random() * 255) | 0;
                    data[i] = data[i + 1] = data[i + 2] = v;
                    data[i + 3] = 255;
                }
                ctx.putImageData(image, 0, 0);
            }
            frame();
            snowTimer = setInterval(frame, 1000 / SNOW_FPS);
        }

        function stopSnow() {
            if (snowTimer) { clearInterval(snowTimer); snowTimer = null; }
        }

        // ---- Bulletin ------------------------------------------------------------
        // Expiry is decided here, in the viewer's browser, rather than by anything
        // deleting the record. That's what lets a bulletin age out on a static site
        // with nothing running server-side: the text stays in playlist.json until
        // it's cleared by hand, but stops being broadcast the moment it's stale.
        var PSA_DEFAULT_HOURS = 24;

        function activePsa() {
            if (!psa || !psa.text) return null;
            var posted = new Date(psa.postedAt);
            if (isNaN(posted)) return null;
            var hours = typeof psa.hours === 'number' ? psa.hours : PSA_DEFAULT_HOURS;
            var ageHours = (Date.now() - posted.getTime()) / 3600000;
            return ageHours < hours ? psa : null;
        }

        function hidePsa() {
            el.psa.classList.remove('visible');
        }

        function renderPsa() {
            el.nowRow.classList.add('hidden');
            disarmWatchdog();
            expectingPlayback = false;
            hideCard();
            if (player && playerReady) player.stopVideo();


            var live = activePsa();
            if (!live) {
                hidePsa();
                el.info.textContent = '';
                showCard({
                    mode: 'testcard',
                    title: 'No bulletin at this time',
                    sub: 'Turn the dial to keep watching'
                });
                return;
            }

            var posted = new Date(live.postedAt);
            el.psaBody.textContent = live.text;
            el.psaStamp.textContent = posted.toLocaleString(undefined, {
                month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });
            el.psa.classList.add('visible');
            // The bulletin screen carries its own heading; naming it twice is noise.
            el.info.textContent = '';
        }

        // ---- Playback ------------------------------------------------------------
        // Nothing scheduled here at all -- the channel exists on the dial but no
        // video carries its tag. Different from having watched everything, and worth
        // saying differently.
        function showEmptyChannel() {
            el.nowRow.classList.add('hidden');
            disarmWatchdog();
            expectingPlayback = false;
            hidePsa();
            if (player && playerReady) player.stopVideo();

            // "You've watched it all" and "there's nothing here" look identical on a
            // dead screen, but they mean opposite things to the viewer -- one is an
            // achievement, the other is an empty channel.
            if (current && current.caughtUp) {
                el.info.textContent = 'All caught up';
                showCard({
                    mode: Math.random() < 0.5 ? 'bars' : 'testcard',
                    title: pick(CAUGHT_UP),
                    sub: 'Try another channel · new programmes appear here'
                });
                return;
            }

            el.info.textContent = 'Nothing on this channel';
            showCard({
                title: pick(TROUBLE),
                sub: 'Nothing scheduled on this channel · turn the dial'
            });
        }

        // The channel played everything it had. This is a sign-off, not a fault.
        function showSignOff() {
            el.nowRow.classList.add('hidden');
            disarmWatchdog();
            expectingPlayback = false;
            hidePsa();
            if (player && playerReady) player.stopVideo();

            var caught = current && current.caughtUp;
            el.info.textContent = caught ? 'All caught up' : 'Off air';
            showCard({
                mode: Math.random() < 0.5 ? 'bars' : 'testcard',
                title: pick(caught ? CAUGHT_UP : SIGN_OFF),
                sub: caught ? 'Try another channel · new programmes appear here'
                            : 'Turn the dial to keep watching'
            });
        }

        function deadEnd() {
            if (current && current.offAir) showSignOff();
            else showEmptyChannel();
        }

        // A film the viewer has abandoned six times has had its chances. Past that
        // it isn't offered again at all: it comes out of the running order for the
        // session, so the channel moves on to something they haven't seen instead
        // of restarting the same picture from the top.
        function isBurnedOut(videoId) {
            var r = resumePoints[videoId];
            return !!(r && r.n >= MAX_RESUMES);
        }

        function dropBurnedOut() {
            if (!current || !current.resume) return;
            if (forceResume) return;   // deliberately retracing; nothing is retired
            // Bounded by the queue length: if every remaining video is burned out,
            // stop rather than spin.
            var guard = current.queue.length;
            while (guard-- > 0 && current.queue.length) {
                var video = current.queue[current.index];
                if (!isBurnedOut(video.videoId)) return;
                console.warn('ThiagoTV: retiring an unfinished video', video.videoId);
                markSeen(video.videoId);
                current.queue.splice(current.index, 1);
                if (!current.queue.length) break;
                if (current.index >= current.queue.length) current.index = 0;
            }
        }

        // On a channel that never repeats, anything already watched has no business
        // being on screen -- including something watched thirty seconds ago, after
        // the running order was built. Without this, marking a video as seen only
        // took effect the next time the queue was rebuilt, so Latest would sit on
        // a video you had just finished with until it ran out on its own.
        //
        // Only for `repeat: false` channels. Everywhere else, seen videos are
        // deliberately still in the rotation, sorted to the back.
        function dropAlreadySeen() {
            if (!current || current.allowRepeats) return;
            if (forceResume) return;   // deliberately retracing: leave it alone
            var guard = current.queue.length;
            while (guard-- > 0 && current.queue.length) {
                var video = current.queue[current.index];
                // The newest programme leads this channel whether or not it has
                // been seen -- that is the front page's promise and it outranks
                // this one. It is always at index 0 of a freshly built queue.
